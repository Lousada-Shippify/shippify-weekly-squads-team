    const p=s.state==='active'?pct(s.doneSP,s.badgeScope):pct(s.delivered,sc);
    const cls=s.state==='active'?'blue':(p>=60?'green':(p>=30?'yellow':'red'));
    return '<td><span class="pill '+cls+'">'+p+'%'+(s.state==='active'?' · andamento':'')+'</span></td>';}).join('');

  const rowIss=list.map(s=>{const tot=s.state==='active'?(s.todoN+s.inprogN+s.doneN):(s.issuesTotal||s.count);

  // Sprint Goal saiu daqui (05/08/2026): o texto do goal é longo e o min-width:160px que ele

  const rowCanc=list.map(s=>'<td>'+(s.cancSP>0?fmtSP(s.cancSP)+' <small>('+s.cancN+' issues)</small>':'—')+'</td>').join('');
  let html='<div class="panel"><h2>'+ico('bars')+'Métricas-chave — '+d.squad.name+' ('+curSquad+')</h2>'+
    '<p class="panel-sub">SP = campo <strong>Story Points</strong> (customfield_10028) — <strong>já é a somatória dos pontos de DEV + QA</strong> registrados nas histórias, tarefas e bugs. Sprints fechadas usam os <strong>números oficiais dos reports</strong> (badges do Jira lidos na época) — os campos atuais do Jira não preservam a foto da sprint (scope commitment, SP re-estimados, clones). Valores com "≈" são reconstruídos dos campos atuais. Sprint ativa: leitura ao vivo, excluindo subtarefas e canceladas.</p>'+
    // container com rolagem própria + 1ª coluna fixa: com 8+ sprints a tabela não empurra a página

    '<tr><td><strong>Scope SP</strong></td>'+rowScope+'</tr>'+
    '<tr><td><strong>Delivered SP</strong></td>'+rowDel+'</tr>'+
    '<tr><td><strong>Taxa SP (%)</strong></td>'+rowRate+'</tr>'+
    '<tr><td><strong>Volume de cards</strong></td>'+rowVol+'</tr>'+
    '<tr><td><strong>Issues Done (%)</strong></td>'+rowIss+'</tr>'+

    '</tbody></table></div></div>';
  // Resumo da sprint encerrada (formato Sprint Review)
  if(d.review){

             :'<span class="t-crit">'+ico('alert',14)+' Não atingida</span>'));

    const qaSP=r.pipe.filter(([st])=>/qa|review/i.test(st)).reduce((x,[,v])=>x+v.sp,0);

    })():'';
    const closedCnt=list.filter(s=>s.state==='closed'&&!String(s.id).startsWith('bl-')).length;
    // Cards com retrabalho por rejeição (changelog: entrou em CODE REVIEW REJECTED / REJECTED BY QA)
    const rework=d.reworkCards||[];
    const reworkBig=rework.filter(r=>r.total>=2);
    const reworkSmall=rework.filter(r=>r.total<2);
    const reworkHtml=rework.length?(
      '<div class="panel"><h2>'+ico('loop')+'Cards com retrabalho por rejeição'+(reworkBig.length?' <span class="pill red">'+reworkBig.length+' com 2+ rejeições</span>':'')+'</h2>'+
      (reworkBig.length?'<div class="rework-grid">'+reworkBig.map(r=>
        '<div class="rework-card"><div class="rc-count">'+r.total+'x</div><div><div class="rc-title"><span class="rc-key">'+esc(r.key)+'</span> · <span class="rc-summary">'+esc((r.summary||'').slice(0,60))+'</span></div>'+
        '<div class="rc-meta">'+esc(r.assignee)+' · '+r.rejCode+' de código / '+r.rejQA+' de QA · agora em <span class="pill '+(/conclu|done/i.test(r.status||'')?'green':'yellow')+'">'+esc(stLabel(r.status))+'</span></div></div></div>'
      ).join('')+'</div>':'')+
      (reworkSmall.length?'<div class="rework-small">+ '+reworkSmall.length+' card(s) com 1 rejeição.</div>':'')+
      '</div>'
    ):'';
    // ── Índice de retorno da squad (sprint atual) + histórico de todas as sprints ──
    const R=d.ret||{cur:null,hist:[],all:{irq:null,irc:null}};
    const rc=R.cur||{irq:null,irc:null,baseQA:0,baseCR:0,rejQA:0,rejCode:0};
    // Sparkline das últimas 5 sprints dentro do próprio tile (pick = qual índice ler no histórico)
    const retSpark=pick=>{
      const hs=(R.hist||[]).slice(-5); if(!hs.length) return '';
      const mx=Math.max(0.01,...hs.map(h=>h[pick]||0));
      return '<div style="display:flex;align-items:flex-end;gap:4px;height:34px;margin-top:10px">'+
        hs.map(h=>{const b=retBand(h[pick]);
          return '<i style="flex:1;height:'+Math.max(3,(h[pick]||0)/mx*32)+'px;background:'+b.c+';border-radius:var(--r-sm) var(--r-sm) 0 0;display:block" title="'+esc(h.name)+' · '+fmtIdx(h[pick])+'"></i>';}).join('')+
        '</div><div style="display:flex;gap:4px;margin-top:3px">'+
        hs.map(h=>'<span style="flex:1;text-align:center;font-size:var(--fs-label);line-height:1.3;color:'+(h.state==='active'?retBand(h[pick]).c:'var(--text-disabled)')+'">'+esc(h.name.replace(/^(EE\s+)?Sprint\s+/,'S'))+'<br><b>'+fmtIdx(h[pick])+'</b></span>').join('')+
        '</div>';};
    const retTile=(title,v,rej,base,hint,affected,pick,reading,noEvents,statusName)=>{
      // 0,00 sem NENHUM evento no histórico da squad não é "ótimo" — é falta de instrumentação.
      // Nesse caso o rótulo avisa, em vez de premiar a squad por um dado que não existe.
      const b=noEvents?{l:'SEM EVENTOS',c:'var(--turquesa)'}:retBand(v);
      if(noEvents) reading='Nenhum "'+statusName+'" registrado no histórico da squad — confirme se o time usa esse status';
      return '<div class="kpi-card" style="box-shadow:1px 0 0 var(--border),inset 3px 0 0 '+b.c+';padding-left:var(--sp-25)">'+
        '<div class="label">'+title+'</div>'+
        '<div class="value" style="color:'+b.c+'">'+fmtIdx(v)+'</div>'+
        '<div class="delta"><span class="pill" style="background:'+b.c+'26;color:'+b.c+'">'+b.l+'</span></div>'+
        '<div class="delta">'+rej+' '+(rej===1?'retorno':'retornos')+' ÷ '+base+' card'+(base===1?'':'s')+' '+hint+' · '+affected+' card'+(affected===1?'':'s')+' afetado'+(affected===1?'':'s')+'</div>'+
        (reading?'<div class="delta" style="color:var(--text-disabled)">'+reading+'</div>':'')+
        '<div class="sbar" style="margin-top:8px"><div style="background:var(--verde);width:16.6%"></div><div style="background:var(--amarelo);width:16.7%"></div><div style="background:var(--laranja);width:33.4%"></div><div style="background:var(--magenta-text);width:33.3%"></div></div>'+
        '<div style="position:relative;height:var(--sp-15);font-size:var(--fs-label)"><span style="position:absolute;left:'+Math.min(100,Math.max(0,(v||0)/1.5*100))+'%;transform:translateX(-50%);font-weight:800;color:'+b.c+';width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:5px solid '+b.c+'"></span></div>'+
        retSpark(pick)+
      '</div>';};
    const maxIrq=Math.max(0.01,...R.hist.map(h=>h.irq||0));
    const sparks=R.hist.map(h=>{const b=retBand(h.irq);
      return '<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px">'+
        '<div style="width:100%;height:'+Math.max(3,(h.irq||0)/maxIrq*54)+'px;background:'+b.c+';border-radius:var(--r-sm) var(--r-sm) 0 0" title="'+esc(h.name)+' — retorno QA '+fmtIdx(h.irq)+' ('+h.rejQA+' ÷ '+h.baseQA+')"></div>'+
        '<div style="font-size:var(--fs-label);color:var(--text-secondary);text-align:center;line-height:1.25">'+esc(h.name.replace(/^Sprint\s+/,'S'))+(h.state==='active'?' <span class="t-now">atual</span>':'')+'<br><strong style="color:'+b.c+'">'+fmtIdx(h.irq)+'</strong></div></div>';}).join('');
    html+='<div class="panel"><h2>'+ico('target')+'Índice de retorno — retrabalho médio por card <span class="pill blue">'+esc(sprintLabel(a))+'</span></h2>'+
      '<p class="panel-sub">Quantas vezes, em média, um card volta antes de passar — <strong>0 é ótimo</strong>. Base = cards que efetivamente chegaram ao estágio (changelog do Jira). Alimenta a re-estimativa: <strong>estimativa ajustada = estimativa prévia × (1 + índice)</strong>.</p>'+
      '<div class="kpi-grid">'+
        retTile('↩︎ Retorno QA (IRQ)',rc.irq,rc.rejQA,rc.baseQA,'que chegaram ao QA',rc.cardsQA||0,'irq',
          rc.irq!=null?('Cada card testado volta ~'+fmtIdx(rc.irq)+'× antes de passar'):'',
          (R.all.rejQA||0)===0,'REJECTED BY QA')+
        retTile('↩︎ Retorno de código (IRC)',rc.irc,rc.rejCode,rc.baseCR,'que entraram em code review',rc.cardsCR||0,'irc',
          rc.irc?('1 em cada '+Math.round(1/rc.irc)+' PRs volta'):(rc.irc===0?'Nenhum PR voltou nesta sprint':''),
          (R.all.rejCode||0)===0,'CODE REVIEW REJECTED')+
        '<div class="kpi-card info">'+
          '<div class="label">Fator de re-estimativa</div>'+
          '<div class="value" style="font-size:var(--fs-h3)">QA '+retFactor(rc.irq)+' <span class="t-dim" style="font-size:var(--fs-h4)">/</span> Dev '+retFactor(rc.irc)+'</div>'+
          '<div class="delta">Sprint atual. Histórico (todas as sprints): <strong>QA '+retFactor(R.all.irq)+' · Dev '+retFactor(R.all.irc)+'</strong></div>'+
          (rc.irq!=null?'<div class="delta">Ex.: 3 SP de QA → <strong style="color:var(--verde)">'+fmtIdx(3*(1+rc.irq))+' SP</strong> reais.</div>':'')+
        '</div>'+
      '</div>'+
      '<div style="display:flex;gap:14px;flex-wrap:wrap;font-size:var(--fs-label);color:var(--text-secondary);margin:0 0 var(--sp-15)">'+
        '<span><i style="display:inline-block;width:var(--sp-1);height:var(--sp-1);border-radius:var(--r-sm);background:var(--verde);margin-right:var(--sp-05)"></i><b>0</b> ótimo</span>'+
        '<span><i style="display:inline-block;width:var(--sp-1);height:var(--sp-1);border-radius:var(--r-sm);background:var(--amarelo);margin-right:var(--sp-05)"></i><b>≤0,25</b> bom</span>'+
        '<span><i style="display:inline-block;width:var(--sp-1);height:var(--sp-1);border-radius:var(--r-sm);background:var(--laranja);margin-right:var(--sp-05)"></i><b>≤0,50</b> atenção</span>'+
        '<span><i style="display:inline-block;width:var(--sp-1);height:var(--sp-1);border-radius:var(--r-sm);background:var(--magenta-text);margin-right:var(--sp-05)"></i><b>≤1,00</b> ruim · <b>&gt;1,00</b> crítico</span>'+
      '</div>'+
      '<h4 style="margin:var(--sp-1) 0;font-size:var(--fs-sm)">'+ico('trend',14)+' Evolução e média histórica — todas as sprints da squad</h4>'+
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start">'+
        '<div class="kpi-grid" style="margin:0">'+
          '<div class="kpi-card"><div class="label">Retorno QA — média geral</div><div class="value" style="color:'+retBand(R.all.irq).c+'">'+fmtIdx(R.all.irq)+'</div><div class="delta">'+R.all.rejQA+' retornos ÷ '+R.all.baseQA+' cards testados · '+R.all.sprints+' sprints</div></div>'+
          '<div class="kpi-card"><div class="label">Retorno código — média geral</div><div class="value" style="color:'+retBand(R.all.irc).c+'">'+fmtIdx(R.all.irc)+'</div><div class="delta">'+R.all.rejCode+' rejeições ÷ '+R.all.baseCR+' cards em review</div></div>'+
        '</div>'+
        '<div class="kpi-card" style="margin:0"><div class="label">Retorno de QA por sprint</div><div style="display:flex;align-items:flex-end;gap:6px;height:82px;margin-top:8px">'+(sparks||'<span style="color:var(--text-disabled);font-size:11px">sem histórico</span>')+'</div></div>'+
      '</div>'+
      '<p style="font-size:11px;color:var(--text-disabled);margin:10px 0 0">Média geral = ponderada por card (todos os cards de todas as sprints da squad), não média de médias — não distorce sprints pequenas. <strong>Escopo do índice:</strong> apenas cards (história/tarefa/bug) que pertencem a alguma sprint do board — <strong>subtarefas e cards sem sprint ficam fora</strong>, porque o índice é medido por sprint e na granularidade de card. Validado em 27/07/2026 contra o Jira (<code>status WAS "REJECTED BY QA"</code>): AE 2/2 e OE 19/19 conferem; na EE, 6 cards que passaram por rejeição estão fora do escopo (sem sprint ou subtarefa).</p>'+
      '</div>';
    html+=reworkHtml;
    html+='<div class="panel"><h2>'+ico('user')+'Desempenho por Dev/QA — '+esc(sprintLabel(a))+'</h2>'+
      '<p class="panel-sub"><strong>DEV</strong> = SP das <strong>subtarefas</strong> (é onde o trabalho de desenvolvimento está alocado — cada subtarefa com seu próprio responsável e status; a soma das subtarefas = a porção dev da história). Histórias <strong>sem subtarefa</strong> usam o campo <strong>Story point dev</strong> do próprio card (e só caem em <em>Story Points total − Story point QA</em> quando esse campo está vazio). Subtarefas canceladas são excluídas. A linha <strong>QA</strong> usa o campo <strong>Story point QA</strong> das histórias/tarefas/bugs (atribuído ao QA quando a issue entra nos status de QA; entregue só em DONE). <strong>Mesma regra de busca e exibição nas 3 squads.</strong></p>'+
      '<div class="table-scroll"><table class="devqa"><thead><tr><th>Dev / QA</th><th>Itens atrib.</th><th>Itens concl.</th><th>SP atribuídos</th><th>SP entregues</th><th>SP em andamento</th><th>SP não iniciados</th><th>Sem SP</th><th>% SP entregue</th><th>↩︎ Ret. QA</th><th>↩︎ Ret. código</th></tr></thead><tbody>'+rowsD+
      '<tr class="total-row"><td class="col-name">TOTAL devs (subtarefas)</td><td>'+totD.n+'</td><td>'+totD.dn+'</td><td>'+fmtSP(totD.sp)+'</td><td>'+fmtSP(totD.dsp)+'</td><td>'+fmtSP(totD.isp)+'</td><td>'+fmtSP(totD.tsp)+'</td><td>'+totD.noSP+'</td>'+
      '<td>'+(totD.sp>0?pct(totD.dsp,totD.sp)+'%':'—')+'</td>'+
      '<td>'+retPill((d.ret&&d.ret.cur)?d.ret.cur.irq:null)+'</td><td>'+retPill((d.ret&&d.ret.cur)?d.ret.cur.irc:null)+'</td></tr>'+
      qaRowHtml+
      '</tbody></table></div>'+
      '<p style="font-size:11px;color:var(--text-disabled);margin:8px 0 0"><strong>↩︎ Ret. QA / Ret. código</strong> = retornos ÷ cards da pessoa que chegaram a cada estágio (0 é ótimo). Na linha de QA aparece a média da squad — o retrabalho que o QA absorve.</p>'+
      (qaRowHtml?'<p style="font-size:11px;color:var(--text-disabled);margin:8px 0 0">'+ico('flask',13)+' A linha de QA é complementar (não soma no TOTAL devs). <strong>DEV</strong> = pontos alocados nas <strong>subtarefas</strong> (ou o <strong>Story point dev</strong> do card, quando não há subtarefa); <strong>QA</strong> = <strong>Story point QA</strong> das histórias, contabilizado quando a issue entra no fluxo de QA. São partes do mesmo Story Points (total = DEV + QA), medidas na granularidade real de cada uma — por isso podem não fechar exatamente com o escopo do card (subtarefas têm estimativa própria e o QA só entra ao chegar no fluxo de QA).</p>':'')+
      '</div>';
    // Matriz Dev/QA × Sprint: entregas (e alocação) por sprint + média final
    const realS=list.filter(s=>!String(s.id).startsWith('bl-'));
    const cellD=(v,s)=>{
      const b=(v.by||{})[s.id];
      if(!b||(!b.aN&&!b.dN)) return '<td style="color:var(--text-disabled)">—</td>';
      return '<td style="white-space:nowrap"><strong style="color:var(--verde)">'+fmtSP(b.dSP)+' SP</strong> · '+b.dN+' tsk'+
        '<br><small style="color:var(--text-secondary)">aloc. '+fmtSP(b.aSP)+' SP · '+b.aN+'</small></td>';
    };
    const avgCell=v=>'<td style="white-space:nowrap;background:rgba(78,203,113,.06)"><strong>'+fmtSP(Math.round(v.avgSP*100)/100)+' SP</strong> · '+(Math.round(v.avgN*10)/10)+' tarefas<br><small style="color:var(--text-secondary)">'+v.partN+' sprint(s) fechada(s)</small></td>';
    html+='<div class="panel"><h2>'+ico('bars')+'Entregas por Dev/QA × Sprint</h2>'+
      '<p class="panel-sub">Por sprint: <strong style="color:var(--verde)">entregue</strong> (SP · tarefas, atribuído à sprint em que a issue foi concluída) e, abaixo, o alocado. Devs na <strong>parcela de DEV</strong> (subtarefas, ou o campo <em>Story point dev</em> nos cards sem subtarefa) — por isso o número é menor que o badge do backlog, que mostra o <em>Story Points total</em> = DEV + QA; linha de QA em <strong>Story point QA</strong> — <strong>alocado</strong> = todo Story point QA das issues da sprint (mesmo número da coluna <em>SP atribuídos</em> em Desempenho por Dev/QA), <strong>entregue</strong> só quando a issue chega a DONE. <strong>Média final</strong> = entregue ÷ '+closedCnt+' sprints fechadas em que participou — recalcula ao vivo quando cada sprint encerra (a atual entra ao fechar).</p>'+
      '<div class="table-scroll" data-scroll-end="1"><table class="wide-sprints"><thead><tr><th>Dev / QA</th>'+realS.map(s=>'<th>'+esc(sprintLabel(s))+(s.state==='active'?' <span class="t-now">atual</span>':'')+'</th>').join('')+'<th>Média final /sprint</th></tr></thead><tbody>'+
      d.devs.map(v=>'<tr><td title="'+esc(v.name)+'"'+(v.name==='Sem responsável'?' style="color:var(--text-disabled);font-style:italic"':' style="font-weight:600"')+'>'+esc(shortName(v.name))+'</td>'+
        realS.map(s=>cellD(v,s)).join('')+avgCell(v)+'</tr>').join('')+
      ((q&&(q.n>0||q.histN>0))?('<tr class="qa-row"><td style="font-weight:600">'+ico('flask',14)+' '+esc(shortName(q.name))+' <span class="pill purple">Story point QA</span></td>'+realS.map(s=>cellD(q,s)).join('')+avgCell(q)+'</tr>'):'')+
      '</tbody></table></div>'+
      // Sprints que só existem como BASELINE oficial (não estão mais nos campos atuais do Jira)
      // não têm quebra por dev — explicitamos em vez de deixar a coluna sumir sem explicação.
      (()=>{const bl=list.filter(s=>String(s.id).startsWith('bl-'));
        if(!bl.length) return '';
        return '<p style="font-size:11px;color:var(--text-disabled);margin:8px 0 0">'+
          bl.map(s=>esc(sprintLabel(s))).join(', ')+' não aparece nesta matriz: essa sprint <strong>não existe no board '+((d.squad&&d.squad.board)||'da squad')+'</strong> (rodou no board compartilhado, antes da squad ter board próprio), então o Jira não permite atribuir as entregas por pessoa. '+
          'Dela só existe o <strong>baseline oficial da squad</strong> ('+bl.map(s=>esc(sprintLabel(s))+': '+fmtSP(s.delivered)+' SP entregues').join(' · ')+'), que aparece em Métricas-chave e na Velocity. '+
          'Reconstruir por dev com os campos de hoje daria números inflados (na AE, 126,5 SP contra os 44,5 SP oficiais), por isso não fazemos.</p>';})()+
      '</div>';
  }
  // canvas com id por squad (map_vel_AE, map_vel_EE…) porque agora as 4 squads convivem na página
  html+='<div class="panel"><h2>'+ico('bars')+'Velocity — Scope vs Delivered</h2><div class="chart-holder"><canvas id="map_vel_'+curSquad+'"></canvas></div></div>';
  return html;
}
// Gráfico de Velocity de uma squad (chamado depois do HTML entrar no DOM)
function drawVelocity(code){
  const d=DATA[code]; if(!d) return;
  const list=d.sprints;
  const scopeOf=s=>s.state==='active'?s.badgeScope:(s.scopeUnknown?null:s.scope);
  const ctx=document.getElementById('map_vel_'+code); if(!ctx) return;
  charts.push(new Chart(ctx,{type:'bar',data:{labels:list.map(sprintLabel),datasets:[
    {label:'Scope SP',data:list.map(s=>scopeOf(s)),backgroundColor:DS.seriesScope,borderColor:DS.turquesa,borderWidth:1},
    {label:'Delivered SP',data:list.map(s=>s.state==='active'?s.doneSP:s.delivered),backgroundColor:DS.seriesDeliv,borderColor:DS.verde,borderWidth:1}
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:DS.textSec,font:{size:11}}}},
    scales:{x:{ticks:{color:DS.textDim},grid:{display:false}},y:{beginAtZero:true,ticks:{color:DS.textDim},grid:{color:DS.gridLine}}}}}));
}

/* ══════════════════════════════════════════════════════════════════════════════════
   ABA DEPENDÊNCIAS (20/08/2026) — quem espera ação de INF / SRG

   REGRA DE LEITURA (definida com Vitor em 20/08/2026): a direção literal do link
   "Action item" no Jira NÃO é confiável — o mesmo tipo aparece gravado nos dois
   sentidos (AE-290 → SEC-184, INF-131 → SEC-189, mas INF-125 ← INFRA-2470). Então
   quem ENTREGA é definido por PRECEDÊNCIA DE PROJETO: SRG (projeto SEC) entrega para
   todos; INF entrega para AE/EE/OE. O outro lado do par é quem ESPERA. Pares sem
   provedor INF/SRG, ou cujo lado que espera não é uma das 4 squads, ficam fora do
   recorte (o total aparece na nota de método, para não sumir silenciosamente).
   A direção crua do Jira é exibida em cada linha para auditoria dos cards.

   ETA (quando a tarefa volta para a squad que espera): duedate do card provedor; se
   não houver, a data final da sprint dele, marcada com "≈" (estimativa); sem as duas,
   entra em "sem previsão". Regra escolhida porque hoje quase nenhum card tem duedate.

   Tipos de link considerados: só "Action item" por enquanto — DEP_LINK_RE aceita mais
   tipos (ex.: /action\s*item|blocks/i) quando Vitor mandar a lista completa. */
const DEP_LINK_RE = /action\s*item/i;
const DEP_SQUAD_BY_PROJECT = {AE:'AE', EE:'EE', OE:'OE', INF:'INF', SEC:'SRG'};
const DEP_RANK = {SRG:2, INF:1};          // precedência de provedor: SRG > INF
const DEP_WAITERS = ['AE','EE','OE','INF'];
const DEP_PROVIDERS = [
  {code:'SRG', name:'SRG — Security, Reliability & Governance', project:'SEC', board:405},
  {code:'INF', name:'Infrastructure',                           project:'INF', board:476},
];
const DEP_SQUAD_NAME = {AE:'Apps Experience', EE:'Ecosystem Experience', OE:'Operation Experience',
                        INF:'Infrastructure', SRG:'SRG'};
let DEPS = null;            // saída de processDeps
let DEP_VIEW = 'open';      // 'open' (padrão — só o que ainda bloqueia) | 'all' (histórico)

const depToday = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const depDate  = iso => iso ? new Date(iso+'T00:00:00') : null;
const depDdmm  = iso => iso ? ddmm(depDate(iso)) : '—';
const depDays  = (a,b) => Math.round((depDate(b)-depDate(a))/86400000);
const depIssueUrl = k => 'https://shippify.atlassian.net/browse/'+k;
// Pill de status do card, na mesma paleta usada no resto do painel
function depStatusPill(cat, name){
  const cls = cat==='done' ? 'green' : (cat==='indeterminate' ? 'yellow' : 'gray');
  return '<span class="pill '+cls+'">'+esc(stLabel(name))+'</span>';
}

// Um lado do par. 'full' = a issue completa (veio na consulta de dependências, com duedate e
// sprint); 'stub' = só o que o próprio link carrega (resumo + status), usado quando o card está
// num projeto fora do recorte da consulta. partial:true sinaliza que não há duedate/sprint.
function depSide(key, full, stub, squad){
  const st = full ? full.status : (stub ? stub.status : null);
  const spr = (full && Array.isArray(full.sprints)) ? full.sprints.filter(Boolean) : [];
  const act = spr.filter(s=>s.state==='active')[0] || spr[spr.length-1] || null;
  return {
    key, squad: squad||null, project: String(key||'').split('-')[0],
    summary: (full&&full.summary) || (stub&&stub.summary) || '',
    status: (st&&st.name) || '—', cat: (st&&st.cat) || 'new',
    assignee: (full&&full.assignee) || null,
    type: (full&&full.type) || '',
    sprint: act ? act.name : null,
    sprintEnd: (act&&act.endDate) ? String(act.endDate).slice(0,10) : null,
    duedate: (full&&full.duedate) ? String(full.duedate).slice(0,10) : null,
    resolved: (full&&full.resolutiondate) ? String(full.resolutiondate).slice(0,10) : null,
    partial: !full,
  };
}
// ETA = data em que a tarefa deve voltar para quem espera. duedate > fim da sprint (≈) > nada.
function depEta(full){
  if(!full) return {date:null, src:null};
  if(full.duedate) return {date:String(full.duedate).slice(0,10), src:'duedate'};
  const spr=(Array.isArray(full.sprints)?full.sprints:[]).filter(s=>s&&s.endDate);
  if(spr.length){
    const s = spr.filter(x=>x.state==='active')[0] || spr[spr.length-1];
    return {date:String(s.endDate).slice(0,10), src:'sprint', sprint:s.name};
  }
  return {date:null, src:null};
}

function processDeps(raw){
  const issues = (raw && Array.isArray(raw.issues)) ? raw.issues : null;
  if(!issues) return null;                     // payload antigo (Worker/data.json sem o bloco deps)
  const byKey={}; issues.forEach(i=>{ if(i&&i.key) byKey[i.key]=i; });
  const squadOf = k => DEP_SQUAD_BY_PROJECT[String(k||'').split('-')[0]] || null;
  const rank = s => DEP_RANK[s] || 0;
  const seen=new Set(); const pairs=[]; let skipped=0; const skippedBy={};
  const bump=(a,b)=>{const k=a+' ~ '+b; skippedBy[k]=(skippedBy[k]||0)+1;};
  for(const iss of issues){
    for(const l of (iss.links||[])){
      if(!l || !l.key || !DEP_LINK_RE.test(l.type||'')) continue;
      const id=[iss.key,l.key].sort().join('~');
      if(seen.has(id)) continue; seen.add(id);
      const sA=squadOf(iss.key), sB=squadOf(l.key);
      let pk,wk,ps,ws;
      if(rank(sA)>rank(sB)){ pk=iss.key; wk=l.key; ps=sA; ws=sB; }
      else if(rank(sB)>rank(sA)){ pk=l.key; wk=iss.key; ps=sB; ws=sA; }
      else { skipped++; bump(String(iss.key).split('-')[0],String(l.key).split('-')[0]); continue; }
      if(DEP_WAITERS.indexOf(ws)<0){ skipped++; bump(String(wk).split('-')[0],String(pk).split('-')[0]); continue; }
      const P = byKey[pk]||null, W = byKey[wk]||null;
      const prov = depSide(pk, P, pk===l.key?l:null, ps);
      const wait = depSide(wk, W, wk===l.key?l:null, ws);
      const eta  = depEta(P);
      const done = prov.cat==='done';
      const late = !done && !!eta.date && eta.date < depToday();
      // Direção como está gravada no Jira (para auditar/corrigir os cards)
      const rawFrom = l.dir==='out' ? iss.key : l.key;
      const rawTo   = l.dir==='out' ? l.key  : iss.key;
      const waitDone = wait.cat==='done';
      // "bloqueando" = o provedor não entregou E o card que espera ainda está aberto. Quando o
      // card que espera já está concluído (o time achou outro caminho, ou fechou sem a entrega),
      // o par deixa de ser bloqueio ativo e vira histórico — foi o caso de AE-290 e INF-410/411/412,
      // todos Concluídos com SEC-184 ainda Em andamento (medido em 20/08/2026).
      pairs.push({id, prov, wait, eta, done, waitDone, blocking: !done && !waitDone, late: late && !waitDone,
                  linkType:l.type||'Action item',
                  rawLabel: rawFrom+' has action item '+rawTo,
                  rawInverted: rawFrom!==pk});
    }
  }
  // Agrupamentos
  const byProvider={}; DEP_PROVIDERS.forEach(p=>{byProvider[p.code]={ticket:{}, order:[]};});
  const byWaiter={};   DEP_WAITERS.forEach(w=>{byWaiter[w]={n:0, open:0, provs:{}, next:null};});
  for(const p of pairs){
    const g=byProvider[p.prov.squad]; if(g){
      if(!g.ticket[p.prov.key]){ g.ticket[p.prov.key]={prov:p.prov, eta:p.eta, done:p.done, late:p.late, blocking:0, waits:[]}; g.order.push(p.prov.key); }
      g.ticket[p.prov.key].waits.push(p);
      if(p.blocking) g.ticket[p.prov.key].blocking++;
    }
    const w=byWaiter[p.wait.squad]; if(w){
      w.n++; if(p.blocking){ w.open++; w.provs[p.prov.squad]=(w.provs[p.prov.squad]||0)+1;
        if(p.eta.date && (!w.next || p.eta.date<w.next)) w.next=p.eta.date; }
    }
  }
  const blocking = pairs.filter(p=>p.blocking);
  const counts = {
    total: pairs.length, blocking: blocking.length,
    released: pairs.filter(p=>p.done).length,
    noImpact: pairs.filter(p=>!p.done&&p.waitDone).length,
    withEta: blocking.filter(p=>p.eta.date).length,
    noEta: blocking.filter(p=>!p.eta.date).length,
    late: blocking.filter(p=>p.late).length,
    squadsBlocked: DEP_WAITERS.filter(w=>byWaiter[w].open>0).length,
    inverted: pairs.filter(p=>p.rawInverted).length,
    skipped, skippedBy,
  };
  return {pairs, byProvider, byWaiter, counts, generatedAt:(raw&&raw.generatedAt)||null};
}

    DEP_WAITERS.map(w=>{const v=DEPS.byWaiter[w];
      const provs=Object.keys(v.provs).map(k=>'<span class="pill '+(k==='SRG'?'purple':'blue')+'">'+esc(k)+' · '+v.provs[k]+'</span>').join(' ')||'—';

        '<td>'+(v.open?'<span class="pill '+(v.open>3?'red':'yellow')+'">'+v.open+'</span>':'<span class="pill green">0</span>')+'</td>'+
        '<td>'+provs+'</td><td>'+(v.next?depDdmm(v.next):'—')+'</td><td>'+v.n+'</td></tr>';}).join('')+

      '. Se quiser QUAL, INFRA, AUT ou MD como provedores/dependentes, é só somar o projeto ao recorte.':'')+'</p>'+

  return html;
}
function depGanttHtml(rows){
  if(!rows.length) return '<p class="deliv t-sec">'+ico('check',14)+' Nenhuma dependência aberta com data de conclusão sinalizada no recorte atual.</p>';
  const today=depToday();
  const items=rows.slice().sort((a,b)=>a.eta.date<b.eta.date?-1:(a.eta.date>b.eta.date?1:0));
  const stamps=items.map(r=>depDate(r.eta.date).getTime()).concat([depDate(today).getTime()]);
  let min=Math.min.apply(null,stamps), max=Math.max.apply(null,stamps);
  if(max-min < 14*86400000) max = min + 14*86400000;      // janela mínima de 2 semanas
  min-=2*86400000; max+=2*86400000;
  const span=max-min;
  const pos=iso=>((depDate(iso).getTime()-min)/span)*100;
  const posMs=ms=>((ms-min)/span)*100;
  // Ticks e rótulos de segunda-feira
  let ticks='', labels='';
  const d0=new Date(min); d0.setHours(0,0,0,0);
  while(d0.getDay()!==1) d0.setDate(d0.getDate()+1);
  for(let t=d0.getTime(); t<=max; t+=7*86400000){
    ticks+='<div class="tick" style="left:'+posMs(t).toFixed(2)+'%"></div>';
    labels+='<span style="left:'+posMs(t).toFixed(2)+'%">'+ddmm(new Date(t))+'</span>';
  }
  const todayLine='<div class="today" style="left:'+pos(today).toFixed(2)+'%" title="hoje"></div>';
  const bars=items.map(r=>{
    const late=r.late;
    const a=late?r.eta.date:today, b=late?today:r.eta.date;
    const l=pos(a), w=Math.max(pos(b)-l, 1.2);
    const est=r.eta.src==='sprint';
    const dias=Math.abs(depDays(today,r.eta.date));
    const tip=r.prov.key+' → libera '+r.wait.key+' · '+(late?'atrasado ':'em ')+dias+' dia(s) · ETA '+depDdmm(r.eta.date)+(est?' (fim da sprint '+(r.eta.sprint||'')+')':' (duedate)');
    return '<div class="dep-row">'+
      '<div class="lbl"><span class="pill '+(r.prov.squad==='SRG'?'purple':'blue')+'">'+esc(r.prov.squad)+'</span> '+
        '<a href="'+depIssueUrl(r.prov.key)+'" target="_blank"><strong>'+esc(r.prov.key)+'</strong></a>'+
        '<br><span class="micro t-sec">libera <a href="'+depIssueUrl(r.wait.key)+'" target="_blank">'+esc(r.wait.key)+'</a> ('+esc(r.wait.squad)+')</span></div>'+
      '<div class="dep-tl">'+ticks+todayLine+
        '<div class="dep-bar'+(late?' late':'')+(est?' est':'')+'" style="left:'+l.toFixed(2)+'%;width:'+w.toFixed(2)+'%" title="'+esc(tip)+'">'+
          depDdmm(r.eta.date)+(est?' ≈':'')+'</div>'+
      '</div></div>';
  }).join('');
  return '<div class="dep-gantt">'+bars+'</div>'+
    '<div class="dep-axis"><div></div><div class="scale">'+labels+'</div></div>';
}

async function boot(){
  const loading=document.getElementById('loading'), eb=document.getElementById('errBox');
  eb.classList.add('hidden');
  loading.classList.remove('hidden');
  document.getElementById('btnRefresh').disabled=true;
  try{
    DATA=await loadAll();   // fetch data.json com cache-bust — sempre a última versão publicada
    loading.classList.add('hidden');
    const anyA=SQUADS.map(s=>DATA[s.code].active).find(Boolean);
    const gen=window.__GEN__?new Date(window.__GEN__).toLocaleString('pt-BR'):'—';
    document.getElementById('subtitle').textContent=anyA?sprintLabel(anyA)+' · Day '+anyA.day+' of '+(anyA.len||WORKDAYS):'Dados do Jira';
    document.getElementById('ctaStatus').innerHTML=window.__LIVE__
      ?ico('bolt',13)+' Consultado ao vivo agora às '+new Date(window.__GEN__).toLocaleTimeString('pt-BR')
      :(LIVE_ENDPOINT
        ?ico('alert',13)+' Proxy indisponível — último snapshot '+gen+' · <a href="'+ACTIONS_URL+'" target="_blank">ver execuções</a>'
        :'Último snapshot '+gen+' · <a href="'+ACTIONS_URL+'" target="_blank">ver execuções</a>');
    document.getElementById('footer').innerHTML='<strong>Método (precisão):</strong> JQL <code>project = X AND sprint is not EMPTY AND issuetype NOT IN subtaskIssueTypes()</code> · SP = campo <strong>Story Points</strong> (customfield_10028), que <strong>já é a somatória DEV + QA</strong> da história/tarefa/bug (revalidado em 12/08/2026: Story Points = <strong>Story point dev</strong> (cf 10548) + Story point QA (cf 10546) em 137 de 146 cards com os três campos). A <strong>parcela de dev</strong> por pessoa vem das subtarefas ou, em cards sem subtarefa, do campo <strong>Story point dev</strong> lido direto — não da subtração <em>total − QA</em>, que zerava o dev nos cards em que o total não foi atualizado depois de somar o QA, somados por status category, sem subtarefas nas 4 squads. <strong>Testamos usar o endpoint “oficial” de relatório de sprint do Jira como fonte única e revertemos</strong>: ele usa uma foto desatualizada dos pontos (mesma fonte do Burndown nativo) e chegou a mostrar a AE com 1,25 SP concluído quando o real era 64+ — por isso o cálculo ao vivo via JQL abaixo continua sendo a fonte da verdade (já bate com o widget “Progresso do sprint” do Jira). Linha QA do Desempenho por Dev/QA: campo <strong>Story point QA</strong> — a issue é atribuída ao QA quando entra nos status de QA (PENDING QA = não iniciado; ON TESTING/ON GOING QA · QA VERIFIED/APPROVED BY QA · QA DENIED/REJECTED BY QA = em andamento); entregue só em DONE; issues em dev não contam para o QA. <strong>Issues em statuses CANCEL (categoria “done” no Jira) são excluídas do scope e nunca contam como entrega</strong>. Sprints <strong>fechadas</strong> usam baselines oficiais dos reports validados (badges lidos na época); valores sem baseline aparecem com “≈” (reconstruídos). Boards: AE 479 · EE 475 · INF 476 · OE 474. O botão <strong>Atualizar</strong> (no topo) consulta o Jira agora mesmo em tempo real (proxy serverless, sem exigir login de quem acessa); se o proxy não estiver configurado, mostra o último snapshot gerado pelo workflow Update data (fallback horário).';
    renderAll();
  }catch(e){
    console.error('[weekly-hub] load error',e);
    loading.classList.add('hidden');
    eb.classList.remove('hidden');
    eb.textContent='Erro ao carregar dados: '+(e.message||e)+' — clique em Atualizar (no topo) para tentar novamente.';
  }finally{
    document.getElementById('btnRefresh').disabled=false;
  }
}
