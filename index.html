<style>
  /* ══ SHIPPIFY DESIGN SYSTEM — camada de tokens ═══════════════════════════════════════════
     Auditado e alinhado ao DS oficial em 03/08/2026 (references/figma-design-system.md).
     Regra: nenhum valor visual hardcoded no CSS ou no JS — tudo referencia um token daqui. */
  :root {
    /* ── TOKENS ESTRUTURAIS (iguais nos dois temas) ─────────────────────────────────────── */
    /* Tipografia: DS de Dashboard usa UMA família em toda a hierarquia — Geologica (04/08/2026) */
    --font-display:Geologica,Inter,Arial,sans-serif;
    --font-body:Geologica,Inter,Arial,sans-serif;
    /* Escala de tipo do DS — sem valores fora dela (antes havia 8/9/10/11.5/12.5/13/13.5/15/19/22/25/26px) */
    --fs-h1:28px; --fs-h2:24px; --fs-h3:20px; --fs-h4:16px;
    --fs-body:16px; --fs-sm:14px; --fs-cap:12px; --fs-label:11px;
    --fs-kpi:28px;                  /* números de KPI em card (Geologica ExtraBold) */
    /* Grade de 8px (exceção do DS: 4px para espaçamento inline apertado) */
    --sp-05:4px; --sp-1:8px; --sp-15:12px; --sp-2:16px; --sp-25:20px; --sp-3:24px;
    --sp-4:32px; --sp-5:40px; --sp-6:48px; --sp-8:64px;
    /* Raio (DS: card 8px · tag/pill 4px) */
    --r-sm:4px; --r-md:8px; --r-pill:999px;
    /* Motion (DS de Dashboard): "operador usa o sistema o dia inteiro — animação lenta cansa" */
    --dur-fast:100ms; --dur-base:200ms; --ease-out:cubic-bezier(0,0,.2,1);
  }

  /* ══ TEMA ESCURO (padrão) ══════════════════════════════════════════════════════════════════
     Paleta aprovada com o time: superfícies #151515/#1E1E1E/#242424 + acentos da marca.
     ATENÇÃO: --verde/--amarelo/--laranja/--magenta/--violeta/--turquesa são tokens SEMÂNTICOS
     (positivo / atenção / alerta / crítico / novo / info), não nomes literais de cor — cada tema
     dá o valor que atinge contraste no seu fundo. O nome legado ficou por compatibilidade. */
  :root, [data-theme="dark"] {
    color-scheme: dark;
    --bg-page:#151515; --bg-surface:#1E1E1E; --bg-card:#242424; --border:#2E2E2E;
    --text-primary:#EEEEEE; --text-secondary:#AAAAAA;
    --text-disabled:#757575;         /* era #666666 → 2.90:1, reprovava o mínimo de 3:1 do DS */
    --verde:#4ECB71; --amarelo:#C19D1E;
    --laranja:#E1773C;               /* laranja da marca clareada: #C1591E dava 3.74:1 no painel */
    --magenta:#C11E42; --violeta:#AA1EC1; --turquesa:#1EA4C1;
    /* variantes claras p/ TEXTO: magenta/violeta puros ficam abaixo de 3:1 no escuro */
    --magenta-text:#EA6789; --violeta-text:#D06CE0;
    --turquesa-ink:#06222B;          /* texto sobre preenchimento turquesa (botão) */
    /* ── Modelo 1b (05/08/2026): FAIXA DE IDENTIDADE + estado ativo em Fluxo ────────────────
       Fluxo (#FEDD29) e Pulso (#EF404C) entram aqui SEM correção tonal: são elementos
       gráficos (filete de 2-3px, ícone de seção), não texto — a regra de 4.5:1 não se
       aplica, e clarear/escurecer a cor da marca num filete descaracterizaria a identidade.
       Onde essas cores viram TEXTO, continuam valendo --amarelo/--magenta (tonais). */
    --fluxo:#FEDD29; --pulso:#EF404C;
    /* A faixa do topo tem seu próprio conjunto de cores porque no escuro ela é Núcleo
       (#151515) e no claro é Puro (#FFFFFF) — em nenhum dos dois ela acompanha --bg-page. */
    --band-bg:#151515; --band-nav-bg:#1A1A1A;
    --band-text:#FFFFFF; --band-text-sec:#DADADA; --band-text-dim:#B4B4B4;
    --band-border:#333333;
    --band-accent:#FEDD29;           /* subtítulo "Engineering Squads" sobre a faixa */
    --band-btn-border:#555555;
    /* Ícone de título de painel: sobre --bg-surface escuro, Fluxo puro tem contraste de sobra */
    --ico-accent:#FEDD29;
    /* Preenchimento de pill a 12% (era 18%): mantém o hex EXATO da marca no texto e ainda
       assim passa 4.5:1 — clarear a cor da marca seria pior para a identidade. */
    --fill-verde:rgba(78,203,113,.12); --fill-amarelo:rgba(193,157,30,.12);
    --fill-laranja:rgba(193,89,30,.12); --fill-magenta:rgba(193,30,66,.12);
    --fill-violeta:rgba(170,30,193,.12); --fill-turquesa:rgba(30,164,193,.12);
    --fill-neutral:rgba(255,255,255,.08); --fill-subtle:rgba(255,255,255,.04);
    --row-odd:rgba(255,255,255,.015); --track:rgba(255,255,255,.10);
    --qa-row:rgba(170,30,193,.08); --qa-row-line:rgba(170,30,193,.35);
    --scroll-thumb:rgba(255,255,255,.16); --scroll-thumb-hover:rgba(255,255,255,.26);
    --shadow-sticky:0 6px 18px -8px rgba(0,0,0,.9);
    --grid-line:rgba(255,255,255,.05);   /* linhas de grade dos gráficos */

  /* ══ TEMA CLARO ════════════════════════════════════════════════════════════════════════════
     Baseado no DS oficial de Dashboard: escala neutra (gray/100→900) para superfícies e texto,
     e semânticas no tom 800 para TEXTO/ícone (as únicas que passam 4.5:1 sobre fundo claro) com
     o tom 100 como preenchimento suave. O verde da marca (#4ECB71) sobre branco dá ~1.8:1 —
     ilegível —, por isso o claro usa green/800 #145C35. */
  [data-theme="light"] {
    color-scheme: light;
    --bg-page:#F8F9FA;               /* gray/100 */
    --bg-surface:#FFFFFF;            /* White  — painéis */
    --bg-card:#F2F2F2;               /* gray/200 — cards e cabeçalho de tabela */
    --border:#DEE2E6;                /* gray/300 */
    --text-primary:#212529;          /* gray/900 */
    --text-secondary:#495057;        /* gray/700 */
    --text-disabled:#6C757D;         /* gray/500 — mínimo legível sobre #F8F9FA */
    --verde:#145C35;                 /* green/800  — positivo */
    --amarelo:#92600A;               /* orange/800 — atenção */
    --laranja:#9A4A0F;               /* laranja escurecido p/ 4.5:1 (alerta) */
    --magenta:#9B1C23;               /* red/800    — crítico */
    --violeta:#810D70;               /* purple/800 — novo/experimental */
    --turquesa:#1D4ED8;              /* blue/800   — info/dados */
    --magenta-text:#9B1C23; --violeta-text:#810D70;
    --turquesa-ink:#FFFFFF;          /* texto sobre preenchimento azul */
    /* Modelo 1b no claro: a faixa de identidade é Puro, o lockup vai direto sobre ela (sem
       placa) e o filete de baixo segue Fluxo — é o que mantém o topo reconhecível nos dois
       temas. O subtítulo troca Fluxo por Pulso: amarelo sobre branco não tem contraste. */
    --fluxo:#FEDD29; --pulso:#EF404C;
    --band-bg:#FFFFFF; --band-nav-bg:#FFFFFF;
    --band-text:#151515; --band-text-sec:#555555; --band-text-dim:#555555;
    --band-border:#DADADA;
    --band-accent:#EF404C;
    --band-btn-border:#DADADA;
    /* Fluxo puro sobre painel branco dá ~1,2:1 — o ícone sumiria. No claro ele usa o tom
       tonal do mesmo semântico (orange/800), que é o que o DS já reserva para "atenção". */
    --ico-accent:#92600A;
    --fill-verde:#D1FAE5; --fill-amarelo:#FEF3C7; --fill-laranja:#FEF3C7;
    --fill-magenta:#FEE8E9; --fill-violeta:#FADDFF; --fill-turquesa:#EFF6FF;
    --fill-neutral:rgba(0,0,0,.06); --fill-subtle:rgba(0,0,0,.04);
    --row-odd:rgba(0,0,0,.02); --track:rgba(0,0,0,.10);
    --qa-row:#FADDFF; --qa-row-line:#A3218E;
    --scroll-thumb:rgba(0,0,0,.22); --scroll-thumb-hover:rgba(0,0,0,.34);
    --shadow-sticky:0 2px 8px rgba(0,0,0,.08);   /* elevation/2 do DS */

  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font-display);background:var(--bg-page);color:var(--text-primary)}
  .wrap{max-width:1180px;margin:0 auto;padding:var(--sp-3) var(--sp-3) var(--sp-8)}
  /* ══ TOPO EM DUAS FAIXAS (modelo 1b, 05/08/2026) ══════════════════════════════════════════
     Antes o topo era um bloco só, confinado na largura do conteúdo. Agora são duas faixas de
     largura total: identidade sobre --band-bg (Núcleo no escuro, Puro no claro) fechada por um
     filete de 2px em Fluxo, e navegação sobre --band-nav-bg. O conteúdo de cada faixa continua
     alinhado à grade da página por .band-inner, que repete o max-width do .wrap. */
  .sticky-top{position:sticky;top:0;z-index:50;box-shadow:var(--shadow-sticky);margin-bottom:var(--sp-3)}
  .band-inner{max-width:1180px;margin:0 auto;padding:0 var(--sp-3)}
  /* Padding menor que o do mockup (28/24): aqui as duas faixas são FIXAS, então cada pixel de
     altura sai da área de leitura. Com 20/16 o header fica em ~180px — o respiro do topo que o
     diagnóstico pedia continua (antes era padding-top de 4px), sem comer meia tela em laptop. */
  .band-id{background:var(--band-bg);border-bottom:2px solid var(--fluxo);padding:var(--sp-25) 0 var(--sp-2)}
  .band-id .band-inner{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:var(--sp-3)}
  /* Logotipo horizontal oficial — troca de variante conforme o tema (nunca recolorido).
     DS: altura mínima 32px, área livre ao redor, sem sombra/rotação/distorção.
     Em 1b o lockup sai de cima do título (empilhado), não mais ao lado dele: sobre a faixa
     escura ele já tem o contraste do suporte e não precisa da placa nem do filete divisor.
     --logo é SVG (não PNG): vetorizado direto dos .ai oficiais (Shippify_logo-*-rgb.ai),
     só a camada "Layer 1" — as camadas WONT EXPORT e LOGO_INFO vêm marcadas OFF no arquivo.
     Cores lidas do próprio vetor, sem conversão: #231F20 (traço/wordmark), #EF414C, #FFDF00.
     Claro = lockup COLORIDO sobre Puro · Escuro = versão negativa (branca) sobre Núcleo.
     Vetor troca nitidez em qualquer tamanho por 15 KB a menos que os dois PNGs anteriores. */
  .brand{display:flex;flex-direction:column;gap:var(--sp-15);min-width:0}
  .brand-logo{width:200px;height:34px;background:var(--logo) left center/contain no-repeat;flex:none}
  .brand-title{min-width:0}
  h1{font-weight:800;font-size:var(--fs-h1);line-height:1.1;letter-spacing:-.01em;margin:0;color:var(--band-text)}
  h1 .brand-sub{display:block;font-size:var(--fs-sm);font-weight:600;color:var(--band-accent);margin-top:var(--sp-05);letter-spacing:0}
  .subtitle{font-family:var(--font-body);color:var(--band-text-sec);font-size:var(--fs-cap);line-height:1.5;margin:0;text-align:right}
  .cta{display:flex;flex-direction:column;align-items:flex-end;gap:var(--sp-1)}
  .cta-actions{display:flex;align-items:center;gap:var(--sp-1)}
  /* Ações do topo — ícone em linha (traço 1,75px). O "Atualizar" volta a ter rótulo: é a única
     ação de escrita da página e o glifo sozinho não dizia o que fazia. */
  .btn-band{height:34px;flex:none;display:inline-flex;align-items:center;gap:7px;padding:0 var(--sp-15);
    border:1px solid var(--band-btn-border);background:transparent;color:var(--band-text-sec);
    border-radius:var(--r-md);font-family:var(--font-display);font-size:var(--fs-sm);font-weight:600;line-height:1;cursor:pointer;
    transition:color var(--dur-fast) var(--ease-out),border-color var(--dur-fast) var(--ease-out)}
  .btn-band.icon-only{width:34px;padding:0;justify-content:center}
  .btn-band:hover{color:var(--band-accent);border-color:var(--band-accent)}
  .btn-band:focus-visible{outline:2px solid var(--fluxo);outline-offset:2px}
  .btn-band:disabled{opacity:.4;cursor:default}
  .cta-status{font-family:var(--font-body);font-size:var(--fs-cap);line-height:1.5;color:var(--band-text-sec);max-width:340px;text-align:right}
  .cta-status a{color:var(--band-accent);font-weight:600;text-decoration:none}
  .cta-status a:hover{text-decoration:underline}
  /* Ícone em linha: herda a cor do texto e alinha na linha de base ótica do rótulo */
  .ico{flex:none;display:inline-block;vertical-align:-2px}
  /* Altura real do header fixo, medida em runtime (trackStickyHeight) e usada pelo
     scroll-margin-top das âncoras. O valor abaixo é só o fallback antes do 1º measure —
     o header muda de altura quando quebra de linha em telas estreitas, então medir é
     mais confiável que fixar um número. */
  :root{--sticky-h:139px}
  /* Seções por squad e o painel de Overview: âncora com respiro pro header fixo não
     cobrir o título ao rolar até eles. */
  .squad-section{scroll-margin-top:calc(var(--sticky-h) + var(--sp-15));padding-top:var(--sp-05);margin-bottom:var(--sp-15)}
  #resumo-overview{scroll-margin-top:calc(var(--sticky-h) + var(--sp-15))}
  .squad-title{font-family:var(--font-display);font-size:var(--fs-h3);margin:var(--sp-3) 0 var(--sp-15);padding-bottom:var(--sp-1);border-bottom:2px solid var(--border)}
  /* Faixa de navegação (modelo 1b): o trilho perde a caixa do segmented control e passa a
     ocupar a faixa inteira. "Resumos" fica à esquerda, separado das squads por um filete
     vertical; o estado ativo é um filete de 3px em Fluxo sob a aba — sem preenchimento.
     A sigla vem em negrito e o nome completo ao lado, em peso normal (antes só a sigla). */
  .band-nav{background:var(--band-nav-bg);border-bottom:1px solid var(--band-border)}
  .band-nav .band-inner{display:flex;align-items:stretch;
    /* -x:auto em vez de wrap: em tela estreita o trilho rola em vez de dobrar e engordar a
       faixa fixa, que rouba altura útil da página. */
    overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
  .squad-tabs{display:flex;align-items:stretch;min-width:0}
  .squad-tabs-group{display:flex;align-items:stretch;gap:var(--sp-05)}
  .squad-nav-top{flex:none;display:inline-flex;align-items:center;gap:7px;
    padding:var(--sp-15) var(--sp-25) var(--sp-15) 0;margin-right:var(--sp-25);
    border-right:1px solid var(--band-border);
    font-family:var(--font-display);font-size:var(--fs-sm);font-weight:600;
    color:var(--band-text-dim);text-decoration:none;white-space:nowrap;
    transition:color var(--dur-fast) var(--ease-out)}
  .squad-tabs button{flex:none;display:inline-flex;align-items:center;gap:var(--sp-05);
    border:none;background:transparent;padding:var(--sp-15) var(--sp-25);
    font-family:var(--font-display);font-size:var(--fs-sm);font-weight:700;
    color:var(--band-text-dim);white-space:nowrap;cursor:pointer;
    transition:color var(--dur-fast) var(--ease-out),box-shadow var(--dur-fast) var(--ease-out)}
  .squad-tabs button .sq-name{font-weight:400}
  .squad-nav-top:hover,
  .squad-tabs button:hover{color:var(--band-text)}
  /* outline para dentro: a faixa tem overflow-x e cortaria o anel de foco por fora */
  .squad-nav-top:focus-visible,
  .squad-tabs button:focus-visible{outline:2px solid var(--fluxo);outline-offset:-2px}
  /* Ativo: Fluxo no filete + texto em cheio. O filete é reforço, não o único sinal — quem não
     distingue a cor lê o estado no peso/contraste do texto. */
  .squad-tabs button.active{color:var(--band-text);box-shadow:inset 0 -3px 0 var(--fluxo)}
  .squad-tabs button.active .sq-name{color:var(--band-text-dim)}
  .panel{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--sp-3);margin-bottom:var(--sp-25)}
  /* Título de painel (1b): ícone em linha em Fluxo + rótulo em h3/700. Substitui o emoji que
     abria cada seção — o emoji renderizava diferente por sistema operacional e não tem traço. */
  .panel h2{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:var(--fs-h3);font-weight:700;margin:0 0 var(--sp-05)}
  .panel h2 .ico{color:var(--ico-accent)}
  .panel .panel-sub{font-family:var(--font-body);font-size:var(--fs-cap);color:var(--text-secondary);margin:0 0 var(--sp-2)}
  table{width:100%;border-collapse:collapse;font-family:var(--font-body);font-size:var(--fs-sm)}
  th,td{text-align:left;padding:var(--sp-15) var(--sp-2);border-bottom:1px solid var(--border);vertical-align:top}
  th{background:var(--bg-card);color:var(--text-secondary);font-family:var(--font-display);font-weight:600;font-size:var(--fs-label);text-transform:uppercase;letter-spacing:.05em}
  tbody tr:nth-child(odd) td{background:var(--row-odd)}
  tr.total-row td{font-weight:700;background:var(--bg-card)!important}
  tr.qa-row td{background:var(--qa-row)!important;border-top:1px solid var(--qa-row-line)}
  /* Desempenho por Dev/QA: colunas de métrica com largura IGUAL entre si (pedido em 28/07/2026).
     table-layout:fixed distribui o espaço pelas larguras declaradas: nome fica maior (texto) e as
     10 colunas numéricas dividem o resto em partes iguais, sem coluna larga/estreita aleatória. */
  /* Tabelas largas (sprints como colunas) ficam confinadas num container com rolagem própria,
     em vez de empurrar a página inteira para o lado (28/07 → INF já tem 8 sprints). O foco abre
     no FINAL (sprints mais recentes) via data-scroll-end. */
  .table-scroll{overflow-x:auto;overflow-y:hidden;max-width:100%;
    scrollbar-color:var(--scroll-thumb) transparent;scrollbar-width:thin}
  .table-scroll::-webkit-scrollbar{height:var(--sp-15)}
  .table-scroll::-webkit-scrollbar-track{background:var(--fill-subtle);border-radius:var(--r-sm)}
  .table-scroll::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border-radius:var(--r-sm)}
  .table-scroll::-webkit-scrollbar-thumb:hover{background:var(--scroll-thumb-hover)}
  .table-scroll table{margin-bottom:0}
  /* 1ª coluna (métrica / nome) fica congelada para não perder a referência ao rolar */
  table.wide-sprints{min-width:max-content}
  table.wide-sprints th:first-child,table.wide-sprints td:first-child{position:sticky;left:0;z-index:2;
    background:var(--bg-card);box-shadow:1px 0 0 var(--border)}
  table.wide-sprints tbody td:first-child{background:var(--bg-surface)}
  /* A linha de QA usa um tint translucido (--qa-row). Na 1a coluna, que e sticky, um fundo
     translucido deixa as celulas que rolam por baixo aparecerem atraves dela — no tema escuro
     isso lia como TEXTO SOBREPOSTO no nome do QA (o claro nao mostrava porque la o token e
     opaco). Aqui o tint e composto sobre uma base opaca: mesma cor da linha, sem vazamento. */
  table.wide-sprints tbody tr.qa-row td:first-child{background:linear-gradient(var(--qa-row),var(--qa-row)),var(--bg-surface)!important}
  table.wide-sprints tbody tr.qa-row td:first-child .pill{margin-left:var(--sp-05)}
  table.wide-sprints thead th{white-space:nowrap}
  table.devqa{table-layout:fixed}
  table.devqa th,table.devqa td{width:8%;text-align:center;padding:var(--sp-15) var(--sp-1);vertical-align:middle;overflow-wrap:break-word}
  table.devqa th:first-child,table.devqa td.col-name{width:20%;text-align:left}
  table.devqa td.col-name{white-space:normal}
  /* Tag/badge do DS: pill 4px, fundo = brand a 20%, texto = brand, Label 11px uppercase-ish */
  .pill{display:inline-block;padding:var(--sp-05) var(--sp-15);border-radius:var(--r-sm);font-family:var(--font-display);font-size:var(--fs-label);font-weight:600;letter-spacing:.03em;white-space:nowrap}
  .pill.green{background:var(--fill-verde);color:var(--verde)}
  .pill.yellow{background:var(--fill-amarelo);color:var(--amarelo)}
  .pill.red{background:var(--fill-magenta);color:var(--magenta-text)}
  .pill.blue{background:var(--fill-turquesa);color:var(--turquesa)}
  .pill.purple{background:var(--fill-violeta);color:var(--violeta-text)}
  .pill.gray{background:var(--fill-neutral);color:var(--text-secondary)}
  /* KPIs em filete (modelo 1b): a caixa sai e ficam só as linhas divisórias — a leitura corre
     na horizontal, como uma régua de números, em vez de seis cartões competindo entre si.
     O divisor é box-shadow (não border) para não entrar no cálculo de largura das colunas;
     o overflow:hidden do grid come a sombra da última coluna de cada linha, então não sobra
     filete solto na borda direita mesmo quando os KPIs quebram em duas linhas. */
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;
    border-bottom:1px solid var(--border);margin-bottom:var(--sp-3);overflow:hidden}
  .kpi-card{background:transparent;border:none;border-radius:0;padding:var(--sp-25) var(--sp-25) var(--sp-25) 0;
    border-top:1px solid var(--border);box-shadow:1px 0 0 var(--border)}
  .kpi-card + .kpi-card{padding-left:var(--sp-25)}
  .kpi-card .label{font-size:var(--fs-label);text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--text-secondary);margin-bottom:var(--sp-1)}
  .kpi-card .value{font-size:var(--fs-kpi);font-weight:800;font-family:var(--font-display);line-height:1;font-variant-numeric:tabular-nums}
  .kpi-card .delta{font-family:var(--font-body);font-size:var(--fs-cap);margin-top:6px;color:var(--text-secondary)}
  /* Destaque de KPI: o filete de 3px passa a ser inset (não border-left), senão a borda
     empurraria o conteúdo da célula 3px para a direita e desalinharia a régua. */
  .kpi-card.crit{box-shadow:1px 0 0 var(--border),inset 3px 0 0 var(--pulso)}
  .kpi-card.info{box-shadow:1px 0 0 var(--border),inset 3px 0 0 var(--turquesa)}
  .kpi-card.crit,.kpi-card.info{padding-left:var(--sp-25)}
  .chart-holder{position:relative;height:260px}
  .squad-block{border:1px solid var(--border);border-radius:var(--r-md);padding:var(--sp-25);margin-bottom:var(--sp-2);background:var(--bg-card)}
  .squad-block h3{margin:0 0 var(--sp-05);font-size:var(--fs-h4)}
  .squad-block h4{font-size:var(--fs-sm)}
  .squad-block .goal{font-family:var(--font-body);font-size:var(--fs-cap);color:var(--text-secondary);margin:0 0 var(--sp-2);white-space:pre-line}
  a.jira-link{color:var(--turquesa);text-decoration:none;font-family:var(--font-body);font-size:var(--fs-cap);font-weight:600}
  a.jira-link:hover{text-decoration:underline}
  .alert-box{background:var(--fill-laranja);border-left:var(--sp-05) solid var(--laranja);padding:var(--sp-2);border-radius:0 var(--r-md) var(--r-md) 0;margin:var(--sp-2) 0}
  .alert-box h4{display:flex;align-items:center;gap:7px;margin:0 0 var(--sp-05);color:var(--laranja);font-size:var(--fs-sm)}
  .alert-box p{margin:0;font-family:var(--font-body);font-size:var(--fs-cap);color:var(--text-primary)}
  .panel h2 .pill{vertical-align:middle;margin-left:var(--sp-1)}
  .rework-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--sp-15);margin-top:var(--sp-2)}
  .rework-card{display:flex;gap:var(--sp-15);align-items:flex-start;background:var(--bg-card);border:1px solid var(--border);border-left:var(--sp-05) solid var(--magenta);border-radius:0 var(--r-md) var(--r-md) 0;padding:var(--sp-15)}
  .rework-card .rc-count{font-family:var(--font-display);font-size:var(--fs-h3);font-weight:800;color:var(--magenta-text);line-height:1.1;white-space:nowrap}
  .rework-card .rc-title{font-size:var(--fs-sm);font-weight:600;margin-bottom:var(--sp-05)}
  .rework-card .rc-title .rc-key{color:var(--turquesa)}
  .rework-card .rc-title .rc-summary{color:var(--text-secondary);font-weight:400}
  .rework-card .rc-meta{font-family:var(--font-body);font-size:var(--fs-cap);color:var(--text-secondary)}
  .rework-small{font-family:var(--font-body);font-size:var(--fs-cap);color:var(--text-secondary);margin-top:var(--sp-15)}
  .loading{display:flex;align-items:center;gap:var(--sp-15);padding:var(--sp-5) 0;justify-content:center;color:var(--text-secondary);font-size:var(--fs-sm);font-family:var(--font-body)}
  .spinner{width:var(--sp-2);height:var(--sp-2);border-radius:50%;border:2px solid var(--border);border-top-color:var(--verde);animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spinner{animation-duration:2s}*{scroll-behavior:auto!important}}
  .err{background:var(--fill-magenta);border:1px solid var(--magenta);border-radius:var(--r-md);padding:var(--sp-2);font-family:var(--font-body);font-size:var(--fs-sm);margin-bottom:var(--sp-2)}
  .footer{font-family:var(--font-body);font-size:var(--fs-cap);color:var(--text-disabled);margin-top:var(--sp-4);border-top:1px solid var(--border);padding-top:var(--sp-2);line-height:1.6}
  .hidden{display:none}
  table.agr th{width:152px;vertical-align:top;background:var(--fill-turquesa);color:var(--text-primary);font-size:var(--fs-cap);text-transform:none;letter-spacing:0}
  table.agr td{white-space:pre-line}
  .agr textarea{width:100%;min-height:44px;background:var(--bg-page);border:1px dashed var(--border);border-radius:var(--r-sm);color:var(--text-primary);font-family:var(--font-body);font-size:var(--fs-cap);padding:var(--sp-1);resize:vertical;white-space:pre-line}
  .agr textarea:focus-visible{outline:2px solid var(--turquesa);outline-offset:1px;border-color:var(--turquesa)}
  .agr textarea::placeholder{color:var(--text-disabled)}
  .deliv{margin:var(--sp-05) 0 var(--sp-15);font-size:var(--fs-cap)}
  .deliv .pill{margin-left:var(--sp-05)}
  .deliv small.brk{color:var(--text-secondary);font-size:var(--fs-cap)}
  .sbar{display:flex;height:var(--sp-1);border-radius:var(--r-sm);overflow:hidden;background:var(--track);margin:var(--sp-05) 0;max-width:460px}
  .sbar>div{height:100%}
  .sbar.lg{height:var(--sp-2);max-width:none;margin:var(--sp-1) 0}
  .sbar-legend{display:flex;gap:var(--sp-3);font-family:var(--font-body);font-size:var(--fs-cap);color:var(--text-secondary);margin-bottom:var(--sp-2);flex-wrap:wrap}
  .sbar-legend b{font-size:var(--fs-h4);display:block;font-family:var(--font-display)}
  /* Decomposição do "Em andamento" por status de subtarefa — mini-barra empilhada + legenda */
  .ipp{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--sp-15);margin:0 0 var(--sp-2)}
  .ipp-head{font-family:var(--font-body);font-size:var(--fs-cap);font-weight:600;color:var(--text-primary);margin-bottom:var(--sp-1)}
  .ipp-head small{font-weight:400;color:var(--text-disabled)}
  .ipp-bar{display:flex;height:var(--sp-15);border-radius:var(--r-sm);overflow:hidden;background:var(--fill-subtle)}
  .ipp-bar>div{height:100%;min-width:var(--sp-05)}
  .ipp-bar>div+div{border-left:1px solid var(--bg-card)}
  .ipp-legend{display:flex;flex-wrap:wrap;gap:var(--sp-1) var(--sp-25);margin-top:var(--sp-15)}
  .ipp-item{display:inline-flex;align-items:center;font-family:var(--font-body);font-size:var(--fs-cap);color:var(--text-secondary)}
  .ipp-item i{width:var(--sp-1);height:var(--sp-1);border-radius:var(--r-sm);margin-right:var(--sp-05);flex:none}
  .ipp-item b{margin-left:var(--sp-05);color:var(--text-primary);font-family:var(--font-display);font-size:var(--fs-cap)}
  /* Diagnóstico da sprint — linhas com bolinha de severidade (crítico / atenção / saudável) */
  .dg{display:flex;gap:var(--sp-1);align-items:flex-start;margin:0 0 var(--sp-1);line-height:1.5}
  .dg:last-child{margin-bottom:0}
  .dg>i,.dg-key i{width:var(--sp-1);height:var(--sp-1);border-radius:var(--r-pill);flex:none;background:var(--text-disabled)}
  .dg>i{margin-top:7px}
  .dg>span{flex:1}
  .dg-crit>i,i.dg-crit{background:var(--magenta)}
  .dg-warn>i,i.dg-warn{background:var(--amarelo)}
  .dg-ok>i,i.dg-ok{background:var(--verde)}
  .dg-key{display:inline-flex;align-items:center;gap:var(--sp-05);margin-left:var(--sp-15)}
  /* Utilitários de texto — evitam repetir style="color:…" inline no JS (66 ocorrências no audit) */
  .t-sec{color:var(--text-secondary)}
  .t-dim{color:var(--text-disabled)}
  .t-ok{color:var(--verde)}
  .t-crit{color:var(--magenta-text)}
  /* "atual" (sprint em curso): Fluxo no escuro, tom tonal no claro — substitui o ⬅️ */
  .t-now{color:var(--ico-accent);font-weight:700}
  .num{font-family:var(--font-display);font-variant-numeric:tabular-nums}
  .micro{font-size:var(--fs-label);line-height:1.3}
  /* ── Aba Dependências (20/08/2026) ─────────────────────────────────────────────
     Gantt em CSS puro (sem Chart.js): as barras são divs posicionadas em % dentro de
     .dep-tl, então seguem os tokens do tema e imprimem junto com a página. */
  .dep-toolbar{display:flex;align-items:center;gap:var(--sp-1);flex-wrap:wrap;margin:0 0 var(--sp-2)}
  .dep-toolbar button{font-family:var(--font-display);font-size:var(--fs-label);font-weight:600;
    background:transparent;color:var(--text-secondary);border:1px solid var(--border);
    border-radius:var(--r-pill);padding:var(--sp-05) var(--sp-15);cursor:pointer;
    transition:color var(--dur-fast) var(--ease-out),border-color var(--dur-fast) var(--ease-out)}
  .dep-toolbar button:hover{color:var(--text-primary);border-color:var(--text-disabled)}
  .dep-toolbar button.active{background:var(--fill-turquesa);color:var(--turquesa);border-color:var(--turquesa)}
  .dep-prov{border:1px solid var(--border);border-radius:var(--r-md);padding:var(--sp-15);
    margin-bottom:var(--sp-15);background:var(--fill-subtle)}
  .dep-prov-head{display:flex;align-items:center;gap:var(--sp-1);flex-wrap:wrap;margin-bottom:var(--sp-05)}
  .dep-prov-head .k{font-family:var(--font-display);font-weight:700}
  .dep-wait-list{display:flex;flex-direction:column;gap:var(--sp-05);margin-top:var(--sp-1);
    padding-left:var(--sp-15);border-left:2px solid var(--border)}
  .dep-wait{font-size:var(--fs-cap);display:flex;align-items:center;gap:var(--sp-1);flex-wrap:wrap}
  .dep-gantt{display:flex;flex-direction:column;gap:var(--sp-1)}
  .dep-row{display:grid;grid-template-columns:230px 1fr;gap:var(--sp-15);align-items:center}
  .dep-row .lbl{font-size:var(--fs-cap);line-height:1.3}
  .dep-tl{position:relative;height:26px;background:var(--fill-subtle);border:1px solid var(--border);border-radius:var(--r-sm)}
  .dep-tl .tick{position:absolute;top:0;bottom:0;width:1px;background:var(--grid-line)}
  .dep-tl .today{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--pulso);opacity:.9}
  .dep-bar{position:absolute;top:5px;height:16px;border-radius:var(--r-sm);background:var(--fill-turquesa);
    border:1px solid var(--turquesa);display:flex;align-items:center;justify-content:flex-end;
    padding:0 var(--sp-05);font-family:var(--font-display);font-size:10px;color:var(--turquesa);
    overflow:hidden;white-space:nowrap}
  .dep-bar.late{background:var(--fill-magenta);border-color:var(--magenta-text);color:var(--magenta-text);
    justify-content:flex-start}
  .dep-bar.est{border-style:dashed}
  .dep-axis{display:grid;grid-template-columns:230px 1fr;gap:var(--sp-15);margin-top:var(--sp-05)}
  .dep-axis .scale{position:relative;height:14px}
  .dep-axis .scale span{position:absolute;transform:translateX(-50%);font-size:10px;
    color:var(--text-disabled);white-space:nowrap}
  @media(max-width:760px){.dep-row,.dep-axis{grid-template-columns:1fr}}
</style>
</head>
<body>
<!-- Header FIXO em DUAS FAIXAS de largura total (modelo 1b): identidade sobre Núcleo/Puro
     fechada por um filete em Fluxo, e navegação (Resumos + squads) na faixa de baixo.
     Fica FORA do .wrap de propósito — dentro dele as faixas pararariam na largura do
     conteúdo (1180px) em vez de atravessar a tela. O alinhamento com a grade da página é
     mantido por .band-inner, que repete o max-width e o padding do .wrap. -->
<div class="sticky-top">
  <div class="band-id">
    <div class="band-inner">
      <div class="brand">
        <span class="brand-logo" role="img" aria-label="Shippify"></span>
        <div class="brand-title">
          <h1>Weekly Product<span class="brand-sub">Engineering Squads</span></h1>
        </div>
      </div>
      <div class="cta">
        <div class="cta-actions">
          <button class="btn-band" id="btnRefresh" disabled title="Atualizar dados — consulta o Jira agora mesmo (tempo real via proxy), sem exigir login de quem acessa"><span id="icoRefresh"></span>Atualizar</button>
          <button class="btn-band icon-only" id="btnTheme" type="button" title="Alternar entre tema claro e escuro"></button>
        </div>
        <!-- Bloco de status: linha 1 = sprint/dia, linha 2 = origem do dado (tempo real ou
             snapshot) + link para as execuções. Antes a sprint aparecia no subtítulo à
             esquerda E o snapshot repetia à direita — a mesma informação em dois lugares. -->
        <p class="subtitle" id="subtitle">Carregando dados do Jira…</p>
        <div class="cta-status" id="ctaStatus">Carregando…</div>
      </div>
    </div>
  </div>
  <nav class="band-nav" aria-label="Navegação por squad">
    <div class="band-inner">
      <div class="squad-tabs">
        <a class="squad-nav-top" href="#resumo-overview" title="Voltar aos resumos do topo"><span id="icoTop"></span>Resumos</a>
        <div class="squad-tabs-group" id="squadNav"></div>
      </div>
    </div>
  </nav>
</div>
<div class="wrap">
  <div id="errBox" class="err hidden"></div>
  <div id="loading" class="loading"><div class="spinner"></div><span id="loadingMsg">Carregando data.json…</span></div>

  <div id="app"></div>

  <div class="footer" id="footer"></div>

// Dias úteis entre duas datas (inclusive nas duas pontas) = duração real da sprint.
function workdaysBetween(start, end){
  if(!start||!end) return 0;
  let d=new Date(start); d.setHours(0,0,0,0);
  const t=new Date(end); t.setHours(0,0,0,0);
  let n=0;
  while(d<=t && n<60){
    const wd=d.getDay();
    if(wd!==0 && wd!==6) n++;
    d.setDate(d.getDate()+1);
  }
  return n;
}
function workdayIndex(start, today, max){
  // business days elapsed from sprint start (inclusive) to today
  let d=new Date(start); d.setHours(0,0,0,0);
  const t=new Date(today); t.setHours(0,0,0,0);
  const cap=max||WORKDAYS;
  let n=0;
  while(d<=t && n<cap){
    const wd=d.getDay();
    if(wd!==0 && wd!==6) n++;
    d.setDate(d.getDate()+1);
  }
  return Math.max(1, n);
}

      rejCode:n.rejCode||0, rejQA:n.rejQA||0, lastRejAt:n.lastRejAt||null, lastRejWhat:n.lastRejWhat||null,
      touchQA:(n.touchQA===undefined
        ? ((n.rejQA||0)>0||RET_QA_RE.test((f.status&&f.status.name)||'')||RET_POST_RE.test((f.status&&f.status.name)||''))
        : !!(n.touchQA||(n.rejQA||0)>0)),
      touchCR:(n.touchCR===undefined
        ? ((n.rejCode||0)>0||RET_CR_RE.test((f.status&&f.status.name)||'')||RET_QA_RE.test((f.status&&f.status.name)||'')||RET_POST_RE.test((f.status&&f.status.name)||''))
        : !!(n.touchCR||(n.rejCode||0)>0)),
      subs:Array.isArray(n.subs)?n.subs:[]});
    const rec=recs[recs.length-1];
    for(const s of sorted){ const agg=getS(s); if(cancelled){agg.cancSP+=sp;agg.cancN++;} else {agg.scope+=sp;agg.count++;} }
    // active-sprint badges (non-subtask issues by status category, cancelled excluded)
    const act = sorted.find(s=>s.state==='active');
    if(act && !cancelled){
      const a=getS(act);
      if(cat==='done'){a.doneSP+=sp;a.doneN++;} else if(cat==='indeterminate'){a.inprogSP+=sp;a.inprogN++;} else {a.todoSP+=sp;a.todoN++;}
    }
    // delivered attribution for history (cancelled never counts as delivered)
    if(cat==='done' && !cancelled){
      let target=null;
      if(res){
        target = sorted.find(s=>{
          const st=s.startDate?new Date(s.startDate):null, en=s.endDate?new Date(s.endDate):null;
          return st&&en&&res>=st&&res<=new Date(en.getTime()+86400000);
        });
        if(!target) target = sorted.filter(s=>s.endDate&&new Date(s.endDate)>=res)[0] || sorted[sorted.length-1];
      } else target = sorted[sorted.length-1];
      const tg=getS(target); tg.delivered+=sp; tg.doneCount++;
      rec.delivClosed = target.state==='closed'; // entrega em sprint já fechada → conta na média por dev
      rec.delivSprintId = target.id; // sprint à qual a entrega foi atribuída (matriz dev × sprint)
    }
  }
  // Sprints "future" (planejadas, não iniciadas) ficam fora do mapa — entram quando ativarem
  const list=[...sprints.values()].filter(s=>s.state!=='future').sort((a,b)=>(a.start||0)-(b.start||0));
  // Sprints fechadas: sobrepõe com o baseline oficial (badges lidos na época) quando existir
  for(const s of list){
    if(s.state!=='closed') continue;
    const b=(BASELINES[sq.code]||{})[sprintLabel(s)];
    if(b){
      s.official=true;
      if(b.scope!=null) s.scope=b.scope; else s.scopeUnknown=true;
      if(b.delivered!=null) s.delivered=b.delivered;
      if(b.volume!=null) s.count=b.volume;
      if(b.issuesDone!=null){ s.doneCount=b.issuesDone; s.issuesTotal=b.issuesTotal; }
    }
  }
  // Sprints fechadas que não existem mais nos campos atuais (ex.: AE Sprint 1) entram só pelo baseline
  const labels=new Set(list.map(sprintLabel));
  for(const [nm,b] of Object.entries(BASELINES[sq.code]||{})){
    if(labels.has(nm)) continue;
    list.push({id:'bl-'+nm, name:nm, state:'closed', official:true, goal:'',
      start:b.start?new Date(b.start+'T12:00:00Z'):null, end:b.end?new Date(b.end+'T12:00:00Z'):null,
      scope:b.scope!=null?b.scope:0, scopeUnknown:b.scope==null,
      count:b.volume||0, delivered:b.delivered||0, doneCount:b.issuesDone||0, issuesTotal:b.issuesTotal||0,
      todoSP:0,inprogSP:0,doneSP:0,todoN:0,inprogN:0,doneN:0,cancSP:0,cancN:0});
  }
  list.sort((a,b)=>(a.start||0)-(b.start||0));
  // Carryover: issue presente na sprint anterior E na seguinte (exclui canceladas)
  for(let i=1;i<list.length;i++){
    const prev=list[i-1], cur=list[i];
    if(String(prev.id).startsWith('bl-')||String(cur.id).startsWith('bl-')){cur.carryNA=true;continue;}
    const carried=recs.filter(r=>!r.cancelled&&r.ids.includes(prev.id)&&r.ids.includes(cur.id));
    cur.carryN=carried.length;
    cur.carrySP=carried.reduce((x,r)=>x+r.sp,0);
    if(cur.state==='active'){
      const by={};
      for(const r of carried){const b=by[r.status]=by[r.status]||{n:0,sp:0};b.n++;b.sp+=r.sp;}
      cur.carryByStatus=by;
    }
  }
  const active=list.find(s=>s.state==='active')||null;
  if(active){
    active.badgeScope=active.todoSP+active.inprogSP+active.doneSP;
    active.remaining=active.todoSP+active.inprogSP;
    // TESTADO E REVERTIDO (20/07/2026): o endpoint "oficial" de relatório de sprint do Jira
    // (greenhopper/sprintreport, mesma fonte do Burndown nativo) usa uma FOTO desatualizada dos
    // pontos — quando testado ao vivo, AE aparecia com 1,25 SP concluído/42,75 SP de escopo,
    // contra o real de 64+ SP concluído/81 SP de escopo (confirmado issue a issue via JQL). OE e
    // EE bateram por coincidência, mas AE provou que essa fonte não é confiável em tempo real —
    // por isso NÃO usamos mais `report` para sobrescrever os números; o cálculo via JQL abaixo
    // (que já bate com o widget "Progresso do sprint" ao vivo do Jira) é a fonte da verdade.
    void report;
    // Duração real desta sprint (dias úteis entre start e end do Jira); cai no padrão se faltar data.
    active.len=workdaysBetween(active.start,active.end)||WORKDAYS;
    active.day=workdayIndex(active.start,new Date(),active.len);
    // Main deliveries: agrupa cards da sprint ativa por épico (parent) ou tag [XXX] do summary
    const acts=recs.filter(r=>!r.cancelled&&r.ids.includes(active.id));
    const gm={};
    for(const r of acts){
      const tag=(r.summary.match(/^\s*\[([^\]]{2,30})\]/)||[])[1];
      const k=r.epic||tag||'Outros / avulsos';
      const g=gm[k]=gm[k]||{n:0,sp:0,dn:0,dsp:0,inN:0,insp:0,ex:[]};
      g.n++; g.sp+=r.sp;
      if(g.ex.length<2&&r.summary&&!/^\s*\[?refin/i.test(r.summary)) g.ex.push(r.summary);
      if(r.cat==='done'){g.dn++; g.dsp+=r.sp;}
      else if(r.cat==='indeterminate'){g.inN++; g.insp+=r.sp;}
    }
    active.deliveries=Object.entries(gm).sort((a,b)=>b[1].sp-a[1].sp);
    active.doneList=acts.filter(r=>r.cat==='done').map(r=>({key:r.key,summary:r.summary,sp:r.sp}));
    // Breakdown do trabalho EM ANDAMENTO por status — UNIDADE DE TRABALHO (folha da árvore).
    // Regra: toda subtarefa em andamento conta; o card conta apenas quando NÃO tem nenhuma
    // subtarefa em andamento (não foi quebrado, ou o próprio card é a unidade — PENDING QA,
    // BLOCKED, REJECTED BY QA…). Assim nada é contado duas vezes (história + subtarefa) e a
    // soma reconcilia com as colunas do board.
    // POR QUE MUDOU (05/08/2026): a versão anterior contava SÓ subtarefas, o que tornava o
    // painel dependente do estilo de cada squad — medido ao vivo no Jira: AE tinha 69 subtarefas
    // na sprint (10 em andamento) enquanto INF tinha 3 (ZERO em andamento), então o painel
    // simplesmente desaparecia para INF apesar de 10 cards em andamento. Pior: statuses que só
    // existem no nível do card (PENDING QA, BLOCKED, REJECTED BY QA) ficavam invisíveis — AE
    // mostrava 10 unidades quando o board tinha 23 itens em andamento em 5 statuses.
    const ipLeaf={}; let ipSubN=0, ipCardN=0;
    for(const r of acts){
      const subsIP=(r.subs||[]).filter(s=>s.c==='indeterminate');
      for(const st of subsIP){ ipLeaf[st.s]=(ipLeaf[st.s]||0)+1; ipSubN++; }
      if(r.cat==='indeterminate' && !subsIP.length){ ipLeaf[r.status]=(ipLeaf[r.status]||0)+1; ipCardN++; }
    }
    active.inprogByStatus=Object.entries(ipLeaf).sort((a,b)=>b[1]-a[1]);
    active.inprogUnits={sub:ipSubN,card:ipCardN};
  }
  // Desempenho por Dev/QA (responsável): sprint atual + média entregue por sprint FECHADA (viva —
  // recalculada a cada sprint encerrada). Participação = sprints fechadas em que teve issues.
  const devMap={};
  const closedIds=new Set(list.filter(s=>s.state==='closed'&&!String(s.id).startsWith('bl-')).map(s=>s.id));
  for(const r of recs){
    if(r.cancelled) continue;
    const nm=r.assignee||'Sem responsável';
    const d=devMap[nm]=devMap[nm]||{name:nm,n:0,dn:0,sp:0,dsp:0,isp:0,tsp:0,noSP:0,histSP:0,histN:0,part:new Set(),by:{},rejCode:0,rejQA:0,baseQA:0,baseCR:0};
    // Rejeições ficam no nível da história (changelog do pai) → creditadas ao assignee do pai.
    if(active&&r.ids.includes(active.id)){
      d.rejCode+=r.rejCode||0; d.rejQA+=r.rejQA||0;
      if(r.touchQA) d.baseQA++;                 // base do índice de retorno de QA da pessoa
      if(r.touchCR) d.baseCR++;                 // base do índice de retorno de código da pessoa
    }
  }
  // Matriz Dev × Sprint (alocado/entregue por sprint) e média final usam a MESMA regra da tabela
  // Desempenho por Dev/QA: DEV = SUBTAREFAS (cada uma com seu responsável e SP), e histórias sem
  // subtarefa usam a porção dev do card (total − Story point QA). Antes esta matriz somava o Story
  // Points TOTAL (dev+QA) no responsável do pai, o que divergia da outra tabela (ex.: EE Sprint 6,
  // José 37 SP na matriz × 26 SP no Dev/QA) e inflava a média final. Corrigido em 03/08/2026.
  const mkDev0=nm=>devMap[nm]=devMap[nm]||{name:nm,n:0,dn:0,sp:0,dsp:0,isp:0,tsp:0,noSP:0,histSP:0,histN:0,part:new Set(),by:{},rejCode:0,rejQA:0,baseQA:0,baseCR:0};
  const liveSubs=r=>(r.subs||[]).filter(s=>!(s.c==='done'&&/cancel|discard|descart/i.test(s.s||'')));
  // Porção DEV de um card SEM subtarefas. Fonte primária: o campo "Story point dev" (10548), que a
  // squad preenche na refinement junto com o "Story point QA" — as duas parcelas são estimadas, não
  // derivadas. Antes calculávamos total − QA, o que zerava a parcela de dev sempre que o TOTAL não
  // tinha sido atualizado depois de somar o QA (AE-245: total 1 / QA 1 / dev 1 → dava 0 SP e o card
  // sumia da linha do Victor; na INF isso escondia 23 SP de dev). A subtração só entra como fallback
  // quando o campo dev está vazio (16 cards hoje), e devolve null quando nem o total foi estimado.
  const devPortion=r=>{
    if(typeof r.spdev==='number') return r.spdev;
    if(r.spNull) return null;
    return Math.max(0,(r.sp||0)-(r.spqa||0));
  };
  for(const r of recs){
    if(r.cancelled) continue;
    const subs=liveSubs(r);
    // unidades de trabalho da história: subtarefas (dev) ou, sem elas, a porção dev do próprio card
    const units=subs.length
      ? subs.map(s=>({who:s.assignee||r.assignee||'Sem responsável', sp:(typeof s.sp==='number'?s.sp:0), done:s.c==='done'}))
      : [{who:r.assignee||'Sem responsável', sp:(devPortion(r)||0), done:r.cat==='done'}];
    for(const u of units){
      const d=mkDev0(u.who);
      for(const sid of r.ids){
        if(closedIds.has(sid)) d.part.add(sid);
        const bs=d.by[sid]=d.by[sid]||{aSP:0,aN:0,dSP:0,dN:0};
        bs.aSP+=u.sp; bs.aN++;
      }
      if(u.done){
        // entrega atribuída à sprint em que a história foi concluída; se ainda não fechou, à ativa
        const target=(r.delivSprintId!=null)?r.delivSprintId
          :((active&&r.ids.includes(active.id))?active.id:null);
        if(target!=null){
          const bs=d.by[target]=d.by[target]||{aSP:0,aN:0,dSP:0,dN:0};
          bs.dSP+=u.sp; bs.dN++;
        }
        if(r.delivClosed){ d.histSP+=u.sp; d.histN++; }
      }
    }
  }
  // Colunas da SPRINT ATUAL por dev = SUBTAREFAS (é nelas que o trabalho de dev acontece; a soma das
  // subtarefas = porção dev da história). Histórias SEM subtarefa usam a porção dev do próprio card
  // (Story Points total − Story point QA). Subtarefas CANCELADAS são excluídas. Assim eliminamos duas
  // distorções: creditar o total (dev+QA) da história ao assignee do pai, e jogar em "Sem responsável"
  // o trabalho que os devs fazem dentro das subtarefas. QA fica na linha própria (Story point QA).
  const mkDev=nm=>devMap[nm]=devMap[nm]||{name:nm,n:0,dn:0,sp:0,dsp:0,isp:0,tsp:0,noSP:0,histSP:0,histN:0,part:new Set(),by:{},rejCode:0,rejQA:0,baseQA:0,baseCR:0};
  const addCur=(nm,sp,cat)=>{const d=mkDev(nm); d.n++; if(sp==null){d.noSP++;} else {d.sp+=sp; if(cat==='done'){d.dn++;d.dsp+=sp;} else if(cat==='indeterminate'){d.isp+=sp;} else {d.tsp+=sp;}}};
  if(active){
    for(const r of recs){
      if(r.cancelled||!r.ids.includes(active.id)) continue;
      const live=(r.subs||[]).filter(s=>!(s.c==='done'&&/cancel|discard|descart/i.test(s.s||'')));
      if(live.length){
        for(const s of live) addCur(s.assignee||r.assignee||'Sem responsável', s.sp, s.c);
      } else {
        addCur(r.assignee||'Sem responsável', devPortion(r), r.cat);
      }
    }
  }
  // A pessoa de QA da squad NÃO aparece nas linhas de DEV (ela é representada só na linha de QA).
  // Casa pelo nome que precede " — QA" no QA_OWNER (ex.: "Nathaly Brasiliano").
  const qaLead=(QA_OWNER[sq.code]||'').split(' — ')[0].trim();
  const isQAperson=nm=>!!qaLead && (nm===qaLead || nm.startsWith(qaLead+' ') || qaLead.startsWith(nm+' '));
  const isNonDev=nm=>NON_DEV.some(x=>nm===x||nm.startsWith(x+' ')||x.startsWith(nm+' '));
  const devs=Object.values(devMap)
    .filter(d=>(d.n>0||d.histN>0||d.rejCode>0||d.rejQA>0) && !isQAperson(d.name) && !isNonDev(d.name))
    .map(d=>({...d,partN:d.part.size,avgSP:d.part.size?d.histSP/d.part.size:0,avgN:d.part.size?d.histN/d.part.size:0}))
    .sort((a,b)=>{if(a.name==='Sem responsável')return 1;if(b.name==='Sem responsável')return -1;return b.sp-a.sp;});
  // Cards com retrabalho por rejeição (sprint ativa): issues com 1+ transições para
  // CODE REVIEW REJECTED (código) ou REJECTED BY QA (QA), via changelog do Jira. Inclui
  // rejeições já corrigidas e reincidências — não é só o status atual.
  const reworkCards = active
    ? recs.filter(r=>!r.cancelled && r.ids.includes(active.id) && ((r.rejCode||0)+(r.rejQA||0))>0)
        .map(r=>({key:r.key,summary:r.summary,assignee:r.assignee||'Sem responsável',rejCode:r.rejCode,rejQA:r.rejQA,
          total:(r.rejCode||0)+(r.rejQA||0),status:r.status}))
        .sort((a,b)=>b.total-a.total)
    : [];
  // ---- QA da squad: pontos do campo "Story point QA" (customfield_10546) nas histórias/tarefas/bugs.
  // A atribuição ao QA só existe quando a issue está nos status de QA (ou já foi entregue).
  const qa={name:QA_OWNER[sq.code]||('QA — '+sq.code),isQA:true,
    n:0,dn:0,sp:0,dsp:0,isp:0,tsp:0,noSP:0,histSP:0,histN:0,part:new Set(),by:{}};
  for(const r of recs){
    if(r.cancelled) continue;
    const v=r.spqa;
    const inQA=QA_PROG_RE.test(r.status), doneQA=r.cat==='done';
    if(v!=null && v>0){
      // ALOCADO por sprint = TODO Story point QA das issues da sprint, independente do status —
      // exatamente a mesma regra da coluna "SP atribuidos" do Desempenho por Dev/QA e da matriz
      // dos devs (que tambem soma alocacao sem olhar status). Antes so entrava aqui o que ja
      // tinha chegado ao fluxo de QA (PENDING QA / ON TESTING / DONE), entao a matriz mostrava
      // MENOS que o Desempenho para a mesma sprint (OE Sprint 7: 24 SP na matriz x 60 SP no
      // Desempenho; AE 3,5 x 12,5; EE 9 x 24; INF 6 x 25). Corrigido em 18/08/2026.
      for(const sid of r.ids){
        if(closedIds.has(sid)) qa.part.add(sid);
        const bs=qa.by[sid]=qa.by[sid]||{aSP:0,aN:0,dSP:0,dN:0};
        bs.aSP+=v; bs.aN++;
      }
      // ENTREGUE continua so em DONE, creditado a sprint em que a issue foi concluida (com
      // fallback para a ativa quando o Jira nao registrou a sprint de entrega) — igual aos devs.
      if(doneQA){
        const target=(r.delivSprintId!=null)?r.delivSprintId
          :((active&&r.ids.includes(active.id))?active.id:null);
        if(target!=null){
          const bs=qa.by[target]=qa.by[target]||{aSP:0,aN:0,dSP:0,dN:0};
          bs.dSP+=v; bs.dN++;
        }
        if(r.delivClosed){ qa.histSP+=v; qa.histN++; }
      }
    }
    // SP atribuídos ao QA = TOTAL real de Story point QA alocado em TODAS as histórias/tarefas/bugs
    // da sprint (soma de todos os cf 10546 > 0), independente do status. O breakdown mostra em que
    // fase esse trabalho de QA está: DONE = entregue · status de QA (ON TESTING/VERIFIED/DENIED) =
    // em andamento · ainda não chegou no QA (dev/PENDING QA) = não iniciado.
    if(active&&r.ids.includes(active.id)){
      if(v==null||v<=0) continue;                 // história sem estimativa de QA não gera trabalho de QA
      qa.n++; qa.sp+=v;
      if(doneQA){ qa.dn++; qa.dsp+=v; }
      else if(inQA) qa.isp+=v;                    // ON TESTING · QA VERIFIED · QA DENIED
      else qa.tsp+=v;                             // ainda não chegou no QA (dev / PENDING QA) = não iniciado
    }
  }
  const qaRow={...qa,partN:qa.part.size,avgSP:qa.part.size?qa.histSP/qa.part.size:0,avgN:qa.part.size?qa.histN/qa.part.size:0};
  // Resumo (Sprint Review) da última sprint FECHADA — formato da Retrospective/Rovo
  let review=null;
  const realClosed=list.filter(s=>s.state==='closed'&&!String(s.id).startsWith('bl-'));
  const lastC=realClosed[realClosed.length-1]||null;
  if(lastC){
    const inS=recs.filter(r=>r.ids.includes(lastC.id));
    const doneIn=inS.filter(r=>!r.cancelled&&r.cat==='done'&&r.delivSprintId===lastC.id);
    const cancIn=inS.filter(r=>r.cancelled);
    const openOut=inS.filter(r=>!r.cancelled&&!(r.cat==='done'&&r.delivSprintId===lastC.id));
    const gm={};
    for(const r of doneIn){const tag=(r.summary.match(/^\s*\[([^\]]{2,30})\]/)||[])[1];const k=r.epic||tag||'Outros';const g=gm[k]=gm[k]||{n:0,sp:0};g.n++;g.sp+=r.sp;}
    const pipe={};
    for(const r of openOut){const p=pipe[r.status]=pipe[r.status]||{n:0,sp:0};p.n++;p.sp+=r.sp;}
    review={s:lastC,
      wins:Object.entries(gm).sort((a,b)=>b[1].sp-a[1].sp).slice(0,4),
      pipe:Object.entries(pipe).sort((a,b)=>b[1].sp-a[1].sp),
      doneN:doneIn.length, doneSP:doneIn.reduce((x,r)=>x+r.sp,0),
      openN:openOut.length, openSP:openOut.reduce((x,r)=>x+r.sp,0),
      cancN:cancIn.length, cancSP:cancIn.reduce((x,r)=>x+r.sp,0)};
  }
  // ── ÍNDICE DE RETORNO por sprint (todas) + sprint atual + média geral ──────────
  const retAgg=new Map();
  for(const r of recs){
    if(r.cancelled) continue;
    for(const sid of r.ids){
      if(!retAgg.has(sid)) retAgg.set(sid,{baseQA:0,baseCR:0,rejQA:0,rejCode:0,cardsQA:0,cardsCR:0});
      const a=retAgg.get(sid);
      if(r.touchQA) a.baseQA++;
      if(r.touchCR) a.baseCR++;
      if((r.rejQA||0)>0) a.cardsQA++;      // cards afetados (≥1 retorno de QA)
      if((r.rejCode||0)>0) a.cardsCR++;    // cards afetados (≥1 rejeição de código)
      a.rejQA+=r.rejQA||0; a.rejCode+=r.rejCode||0;
    }
  }
  const retHist=list.filter(s=>!String(s.id).startsWith('bl-')&&retAgg.has(s.id)).map(s=>{
    const a=retAgg.get(s.id);
    return {id:s.id,name:sprintLabel(s),state:s.state,...a,irq:retIdx(a.rejQA,a.baseQA),irc:retIdx(a.rejCode,a.baseCR)};
  });
  const retAll=retHist.reduce((x,h)=>({baseQA:x.baseQA+h.baseQA,baseCR:x.baseCR+h.baseCR,rejQA:x.rejQA+h.rejQA,rejCode:x.rejCode+h.rejCode,cardsQA:x.cardsQA+h.cardsQA,cardsCR:x.cardsCR+h.cardsCR}),{baseQA:0,baseCR:0,rejQA:0,rejCode:0,cardsQA:0,cardsCR:0});
  retAll.irq=retIdx(retAll.rejQA,retAll.baseQA); retAll.irc=retIdx(retAll.rejCode,retAll.baseCR);
  retAll.sprints=retHist.length;
  const retCur=active?(retHist.find(h=>h.id===active.id)||null):null;
  const ret={cur:retCur,hist:retHist,all:retAll};
  // ── DIAGNÓSTICO AUTOMÁTICO DA SPRINT ─────────────────────────────────────────────────────────
  // Substitui os campos abertos de Sprint Agreements (Constraints / Risks / Validations), que
  // dependiam de curadoria manual e ficavam em branco a cada virada de sprint (05/08/2026).
  // Toda linha aqui é derivada dos dados ao vivo e carrega o número que sustenta a conclusão —
  // nada de texto livre. Severidade: crit (vermelho) · warn (amarelo) · ok (verde).
  if(active){
    const A=recs.filter(r=>!r.cancelled&&r.ids.includes(active.id));
    const scope=active.badgeScope||0, day=active.day||0, len=active.len||WORKDAYS, left=Math.max(0,len-day);
    const C=[],R=[],V=[];
    const add=(g,sev,text)=>g.push({sev,text});
    const pl=(n,s1,s2)=>n+' '+(n===1?s1:s2);
    const kl=arr=>arr.slice(0,4).map(r=>esc(r.key)).join(' · ')+(arr.length>4?' <span class="t-dim">+'+(arr.length-4)+'</span>':'');
    const closedS=list.filter(s=>s.state==='closed');
    const avgDel=closedS.length?closedS.reduce((x,s)=>x+(s.delivered||0),0)/closedS.length:0;
    const alloc=devs.filter(d=>d.name!=='Sem responsável'&&d.sp>0);
    const totAl=alloc.reduce((x,d)=>x+d.sp,0);

    // ── Restrições & capacidade ──────────────────────────────────────────────────
    if(active.carryNA){
      add(C,'ok','Primeira sprint com dados no board — sem sprint anterior para medir carryover.');
    }else{
      const cp=pct(active.carrySP||0,scope);
      add(C, cp>=40?'crit':(cp>=25?'warn':'ok'),
        '<b>'+cp+'% do escopo veio da sprint anterior</b> — '+fmtSP(active.carrySP||0)+' SP em '+(active.carryN||0)+' issues. '+
        (cp>=40?'A capacidade real para trabalho novo é de apenas '+fmtSP(scope-(active.carrySP||0))+' SP.'
              :(cp>=25?'Um quarto da sprint já entrou comprometido com dívida.':'Carryover sob controle.')));
    }
    if(avgDel>0&&scope>0){
      const ratio=Math.round(scope/avgDel*10)/10;
      add(C, ratio>=1.8?'crit':(ratio>=1.3?'warn':'ok'),
        '<b>Escopo de '+fmtSP(scope)+' SP contra média de '+fmtSP(avgDel)+' SP entregues</b> nas '+closedS.length+' sprints fechadas ('+ratio+'×). '+
        (ratio>=1.8?'Overcommit: a squad historicamente não entrega esse volume — decida agora o que é sacrificável.'
                  :(ratio>=1.3?'Acima do histórico; priorize o que não pode escorregar.':'Compatível com o histórico da squad.')));
    }
    const noEst=A.filter(r=>r.spNull);
    if(noEst.length) add(C, noEst.length>=4?'warn':'ok',
      '<b>'+pl(noEst.length,'card sem estimativa','cards sem estimativa')+'</b> ('+kl(noEst)+') — fora do escopo e do burndown, então o gráfico não representa a sprint inteira.');
    // Qualidade da estimativa: card sem subtarefa precisa ter "Story point dev" preenchido, senão a
    // porção de dev vira o resto da subtração e pode não representar o trabalho real de desenvolvimento.
    const noDev=A.filter(r=>!(r.subs||[]).length && r.spdev==null && (r.spqa!=null||!r.spNull));
    if(noDev.length) add(C, noDev.length>=3?'warn':'ok',
      '<b>'+pl(noDev.length,'card sem "Story point dev"','cards sem "Story point dev"')+'</b> ('+kl(noDev)+') — sem subtarefa e sem a parcela de dev estimada, o painel cai no fallback <em>total − QA</em>, que subestima o dev quando o total não foi atualizado.');
    const noOwn=A.filter(r=>!r.assignee);
    if(noOwn.length) add(C, noOwn.length>=3?'warn':'ok',
      '<b>'+pl(noOwn.length,'card sem responsável','cards sem responsável')+'</b> ('+kl(noOwn)+') — ninguém assumiu, então não há a quem cobrar o andamento.');
    if(alloc.length&&totAl>0){
      const top=alloc[0], sh=pct(top.sp,totAl);
      add(C, sh>=45?'crit':(sh>=35?'warn':'ok'),
        '<b>'+esc(shortName(top.name))+' concentra '+sh+'% dos SP alocados</b> ('+fmtSP(top.sp)+' de '+fmtSP(totAl)+' SP entre '+alloc.length+' devs). '+
        (sh>=35?'Ponto único de falha: uma ausência derruba a sprint.':'Distribuição equilibrada entre a squad.'));
    }
    if((active.cancN||0)>0) add(C, (active.cancSP||0)>=scope*0.3?'warn':'ok',
      '<b>'+pl(active.cancN,'issue cancelada','issues canceladas')+'</b> ('+fmtSP(active.cancSP||0)+' SP) saíram do escopo depois do planejamento.');

    // ── Riscos ───────────────────────────────────────────────────────────────────
    const paceNow=day>0?active.doneSP/day:0, need=left>0?active.remaining/left:active.remaining;
    add(R, (left>0&&need>paceNow*2)?'crit':((left>0&&need>paceNow*1.3)?'warn':'ok'),
      '<b>Dia '+day+'/'+len+' com '+pct(active.doneSP,scope)+'% concluído</b> (ideal '+Math.round(day/len*100)+'%). '+
      (left>0?'Faltam '+fmtSP(active.remaining)+' SP em '+pl(left,'dia útil','dias úteis')+' → exige '+fmtSP(need)+' SP/dia contra '+fmtSP(paceNow)+' SP/dia do ritmo atual.'
            :'Último dia da sprint: '+fmtSP(active.remaining)+' SP seguem abertos e viram carryover.'));
    const ipl=active.inprogByStatus||[], totU=ipl.reduce((x,kv)=>x+kv[1],0);
    const grp=re=>ipl.filter(kv=>re.test(kv[0])).reduce((x,kv)=>x+kv[1],0);
    if(totU){
      const qRev=grp(/code\s*review|pr\s*review/i), qQA=grp(/\bqa\b|testing/i), qBlk=grp(/block|waiting\s*for\s*tasks/i);
      if(qRev) add(R, pct(qRev,totU)>=50?'crit':(pct(qRev,totU)>=30?'warn':'ok'),
        '<b>'+qRev+' de '+totU+' unidades em andamento estão em code review</b> ('+pct(qRev,totU)+'%)'+
        (pct(qRev,totU)>=30?' — o trabalho sai do dev mas não fecha; a revisão é o gargalo da sprint.':' — fila de revisão em volume normal.'));
      if(qQA) add(R, pct(qQA,totU)>=40?'warn':'ok',
        '<b>'+pl(qQA,'unidade na fila de QA','unidades na fila de QA')+'</b> — '+pct(qQA,totU)+'% de tudo que está em andamento depende do QA para virar entrega.');
      if(qBlk) add(R,'crit',
        '<b>'+pl(qBlk,'unidade parada','unidades paradas')+'</b> (BLOCKED / WAITING FOR TASKS) — dependência externa segurando a entrega.');
      const nd=alloc.length||1, wip=Math.round(totU/nd*10)/10;
      add(R, wip>=3?'crit':(wip>=2?'warn':'ok'),
        '<b>WIP de '+wip+' '+(wip===1?'item':'itens')+' por dev</b> ('+totU+' em andamento para '+pl(nd,'dev','devs')+'). '+
        (wip>=2?'Paralelismo alto: tudo anda devagar ao mesmo tempo e nada fecha.':'WIP saudável.'));
    }
    if(reworkCards.length){
      const totRej=reworkCards.reduce((x,r)=>x+r.total,0), big=reworkCards.filter(r=>r.total>=2);
      add(R, big.length>=3?'crit':(reworkCards.length>=3?'warn':'ok'),
        '<b>'+pl(reworkCards.length,'card voltou por rejeição','cards voltaram por rejeição')+'</b> — '+pl(totRej,'devolução','devoluções')+' no total'+(big.length?', '+big.length+' com 2 ou mais':'')+': '+kl(reworkCards)+'.');
    }
    if(!active.goal) add(R,'warn',
      '<b>Sprint sem goal registrado no Jira</b> — sem objetivo declarado não existe critério para cortar escopo quando apertar.');

    // ── Validações pendentes ─────────────────────────────────────────────────────
    const qQAcards=A.filter(r=>QA_WAIT_RE.test(r.status)||QA_PROG_RE.test(r.status));
    if(qQAcards.length){
      const spQA=qQAcards.reduce((x,r)=>x+r.sp,0);
      add(V, left>0&&qaRow.tsp>0&&qaRow.tsp/left>3?'warn':'ok',
        '<b>'+pl(qQAcards.length,'card na mão do QA','cards na mão do QA')+'</b> ('+fmtSP(spQA)+' SP de dev): '+kl(qQAcards)+'. '+
        (qaRow.tsp>0?'Ainda há '+fmtSP(qaRow.tsp)+' SP de QA não iniciados para '+pl(left,'dia útil','dias úteis')+'.':'Todo o trabalho de QA da sprint já começou.'));
    }
    const rwOpen=reworkCards.filter(r=>!/conclu|done/i.test(r.status||''));
    if(rwOpen.length) add(V,'warn',
      '<b>'+pl(rwOpen.length,'card rejeitado ainda aberto','cards rejeitados ainda abertos')+'</b> ('+kl(rwOpen)+') — vão ocupar a fila de QA de novo antes do fim da sprint.');
    const waitDep=A.filter(r=>/deploy|release|monitoring/i.test(r.status||''));
    if(waitDep.length) add(V,'ok',
      '<b>'+pl(waitDep.length,'card pronto aguardando deploy/monitoring','cards prontos aguardando deploy/monitoring')+'</b> ('+kl(waitDep)+') — entrega técnica feita, falta o passo de liberação.');
    if(!V.length) add(V,'ok','Nenhum card em fila de validação no momento — nada esperando QA, deploy ou reteste.');

    const ord={crit:0,warn:1,ok:2};
    const srt=g=>g.sort((x,y)=>ord[x.sev]-ord[y.sev]);
    active.diag={constraints:srt(C),risks:srt(R),validations:srt(V)};
  }
  return {squad:sq, sprints:list, active, issueCount:nodes.length, devs, qa:qaRow, review, reworkCards, ret};
}

// Tenta consultar o Jira agora mesmo via Worker (tempo real). Timeout para não travar a página
// se o Worker não estiver configurado/acessível — nesse caso volta null e cai no fallback.
// 25s (era 12s): desde que o Worker passou a buscar changelog completo (retrabalho por rejeição)
// o payload ficou maior e a consulta às vezes passa de 12s, o que estava derrubando pro snapshot
// antigo com falso "Proxy indisponível" (medido em 22/07/2026: até ~12s só na resposta do fetch).
async function fetchLive(timeoutMs){
  if(!LIVE_ENDPOINT) return null;
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),timeoutMs||25000);
  try{
    const r=await fetch(LIVE_ENDPOINT+'?t='+Date.now(),{signal:ctrl.signal,cache:'no-store'});
    clearTimeout(timer);
    if(!r.ok) return null;
    const d=await r.json();
    if(d.error) return null;
    return d;
  }catch(e){ clearTimeout(timer); return null; }
}

async function loadAll(){
  document.getElementById('loadingMsg').textContent=LIVE_ENDPOINT?'Consultando o Jira em tempo real…':'Carregando último snapshot…';
  let raw=await fetchLive();
  let live=!!raw;
  if(!raw){
    if(LIVE_ENDPOINT) document.getElementById('loadingMsg').textContent='Proxy indisponível — carregando último snapshot…';
    const resp=await fetch('data.json?v='+Date.now(),{cache:'no-store'});
    if(!resp.ok) throw new Error('Nem o proxy em tempo real nem o data.json de fallback responderam. No repositório: Settings > Secrets and variables > Actions > cadastre JIRA_EMAIL e JIRA_API_TOKEN, depois Actions > "Update data" > Run workflow.');
    raw=await resp.json();
  }
  window.__GEN__=raw.generatedAt;
  window.__LIVE__=live;
  const results={};
  for(const sq of SQUADS){ results[sq.code]=processSquad(sq,(raw.squads&&raw.squads[sq.code])||[],(raw.sprintReport&&raw.sprintReport[sq.code])||null); }
  // Dependências: se o payload em tempo real ainda não traz o bloco deps (Worker publicado numa
  // versão anterior), busca SÓ as dependências no snapshot do repo — assim a aba já funciona antes
  // do paste no Cloudflare, e as métricas das squads seguem 100% ao vivo.
  let depsRaw=raw.deps||null;
  window.__DEPSRC__=depsRaw?(live?'live':'fallback'):null;   // 'snapshot' = proxy vivo, mas sem deps
  if(live&&!depsRaw){
    try{
      const r=await fetch('data.json?v='+Date.now(),{cache:'no-store'});
      if(r.ok){ const snap=await r.json(); depsRaw=snap.deps||null;
        if(depsRaw){ window.__DEPSRC__='snapshot'; window.__DEPGEN__=snap.generatedAt; } }
    }catch(e){}
  }
  DEPS=processDeps(depsRaw);   // null quando nem o proxy nem o snapshot trazem o bloco deps
  return results;
}

function statusPill(p, day, len){
  if(day<=2 && p<10) return '<span class="pill blue">'+p+'% · início</span>';
  const ideal = Math.round(day/(len||WORKDAYS)*100);
  if(p>=ideal-5) return '<span class="pill green">'+p+'%</span>';
  if(p>=ideal*0.5) return '<span class="pill yellow">'+p+'%</span>';
  return '<span class="pill red">'+p+'%</span>';
}
function boardUrl(sq){return 'https://shippify.atlassian.net/jira/software/c/projects/'+sq.project+'/boards/'+sq.board+'?isInsightsOpen=true';}
function sprintLabel(s){return s? s.name.replace(/^EE\s+/,''):'—';}

/* ---------- VIEW 1: Sprint Plan ---------- */
// Resumos do topo da página única: Overview (todas as squads) + Índice de retorno comparativo.
function summariesHtml(){
  const rows=[], today=new Date();
  let totScope=0, totDone=0;
  for(const sq of SQUADS){
    const d=DATA[sq.code], a=d.active;
    if(!a){rows.push('<tr><td><strong>'+sq.name+'</strong></td><td colspan="6" style="color:var(--text-secondary)">Sem sprint ativa no momento (virada de sprint) — inicie a próxima sprint no board para os dados aparecerem</td></tr>');continue;}
    totScope+=a.badgeScope; totDone+=a.doneSP;
    rows.push('<tr><td><strong>'+sq.name+'</strong><br><span class="t-sec" style="font-size:var(--fs-cap)">'+esc(sprintLabel(a))+' · '+ddmm(a.start)+'–'+ddmm(a.end)+'</span></td>'+
      '<td style="max-width:280px">'+esc((a.goal||'—').split('\n').slice(0,3).join(' '))+'</td>'+
      '<td>'+fmtSP(a.badgeScope)+'</td><td>'+fmtSP(a.doneSP)+'</td><td>'+fmtSP(a.remaining)+'</td>'+
      '<td>'+statusPill(pct(a.doneSP,a.badgeScope),a.day,a.len)+'</td>'+
      '<td>'+statusPill(pct(a.doneN,a.todoN+a.inprogN+a.doneN),a.day,a.len)+'</td></tr>');
  }
  // As squads podem estar em sprints diferentes (ex.: INF na Sprint 8 e as outras na 6), então o
  // título do Overview não fixa mais um número de sprint — cada linha mostra a sua.
  const anyActive=SQUADS.map(s=>DATA[s.code].active).find(Boolean);
  const dayStr=anyActive?('Day '+anyActive.day+' of '+(anyActive.len||WORKDAYS)):'';
  let html='<div class="panel" id="resumo-overview"><h2>'+ico('flag')+'Overview — sprint atual de cada squad <span class="pill blue">'+dayStr+'</span></h2>'+
    '<p class="panel-sub">SP = campo <strong>Story Points</strong> (customfield_10028), que <strong>já é a somatória dos pontos de DEV + QA</strong> da história/tarefa/bug, somado por status category do board, <strong>sem subtarefas</strong> (os pontos vivem nos cards principais — regra igual aos badges do backlog nas 3 squads) e <strong>excluindo issues canceladas</strong> (statuses CANCEL têm categoria “done” no Jira mas não são entrega). Duas métricas: <strong>% Done (SP)</strong> = Completed SP ÷ Scope SP · <strong>% Done (issues)</strong> = contagem de tickets.</p>'+
    '<table><thead><tr><th>Squad</th><th>Sprint Goal</th><th>Scope SP</th><th>Completed SP</th><th>Remaining SP</th><th>% Done (SP)</th><th>% Done (issues)</th></tr></thead><tbody>'+rows.join('')+
    '<tr class="total-row"><td>Total</td><td>—</td><td>'+fmtSP(totScope)+'</td><td>'+fmtSP(totDone)+'</td><td>'+fmtSP(totScope-totDone)+'</td><td>'+pct(totDone,totScope)+'%</td><td>—</td></tr>'+
    '</tbody></table></div>';

  // Índice de retorno — visão resumida comparando as 3 squads (detalhe completo na aba por squad)
  const retRows=SQUADS.map(sq=>{
    const r=(DATA[sq.code]||{}).ret; if(!r) return '';
    const c=r.cur||{irq:null,irc:null,baseQA:0,baseCR:0,rejQA:0,rejCode:0};
    // Sem nenhum evento no histórico = índice não instrumentado (não é mérito da squad)
    const noQA=(r.all.rejQA||0)===0, noCR=(r.all.rejCode||0)===0;
    const naPill='<span class="pill" style="background:rgba(30,164,193,.15);color:var(--turquesa)">sem eventos</span>';
    return '<tr><td><strong>'+sq.name+'</strong> <span class="pill gray">'+sq.code+'</span></td>'+
      '<td>'+(noQA?naPill:retPill(c.irq))+'<br><small style="color:var(--text-secondary)">'+c.rejQA+' ÷ '+c.baseQA+' testados</small></td>'+
      '<td>'+(noCR?naPill:retPill(c.irc))+'<br><small style="color:var(--text-secondary)">'+c.rejCode+' ÷ '+c.baseCR+' em review</small></td>'+
      '<td>'+retPill(r.all.irq)+'<br><small style="color:var(--text-secondary)">'+r.all.sprints+' sprints · '+r.all.rejQA+' ÷ '+r.all.baseQA+'</small></td>'+
      '<td>'+retPill(r.all.irc)+'<br><small style="color:var(--text-secondary)">'+r.all.rejCode+' ÷ '+r.all.baseCR+'</small></td>'+
      '<td><strong>QA '+retFactor(r.all.irq)+'</strong> · Dev '+retFactor(r.all.irc)+'</td></tr>';
  }).join('');
  html+='<div class="panel" id="resumo-retorno"><h2>'+ico('target')+'Índice de retorno — retrabalho médio por card <span class="pill blue">0 é ótimo</span></h2>'+
    '<p class="panel-sub">Quantas vezes, em média, um card <strong>volta</strong> antes de passar. <strong>Retorno QA</strong> = entradas em REJECTED BY QA / QA DENIED ÷ cards que chegaram ao QA · <strong>Retorno código</strong> = entradas em CODE REVIEW REJECTED ÷ cards que entraram em code review (changelog do Jira, inclui reincidências). Faixas: <strong style="color:var(--verde)">0 ótimo</strong> · ≤0,25 bom · ≤0,50 atenção · ≤1,00 ruim · &gt;1,00 crítico. O <strong>fator</strong> (1 + índice histórico) é o multiplicador sugerido para a pontuação prévia no refinamento. <strong>“sem eventos”</strong> = a squad nunca registrou aquele status de rejeição no histórico: o índice não é 0 por qualidade, é falta de instrumentação no fluxo do board — verificar antes de comparar squads. <strong>Escopo:</strong> só cards dentro de sprint, sem subtarefas.</p>'+
    '<table><thead><tr><th>Squad</th><th>↩︎ Retorno QA (sprint atual)</th><th>↩︎ Retorno código (sprint atual)</th><th>Média histórica QA</th><th>Média histórica código</th><th>Fator de re-estimativa</th></tr></thead><tbody>'+retRows+'</tbody></table></div>';
  return html;
}

// Bloco de Sprint Plan de UMA squad (agreements, progresso, KPIs e burndown) — retorna HTML.
function squadPlanHtml(sq){
    let html='';
    const d=DATA[sq.code], a=d.active;
    if(!a) return '<div class="squad-block"><h3>'+sq.name+'</h3><p style="color:var(--text-secondary);margin:0">Sem sprint ativa no momento (virada de sprint) — inicie a próxima sprint no board para os dados aparecerem.</p></div>';
    const pSP=pct(a.doneSP,a.badgeScope), pIss=pct(a.doneN,a.todoN+a.inprogN+a.doneN);
    const LEN=a.len||WORKDAYS;
    const idealRem=a.badgeScope*(1-a.day/LEN);
    const diff=a.remaining-idealRem;
    // "atrás do ideal" com folga de 0,5 SP (mesmo limiar do rótulo abaixo, para o filete e o
    // texto nunca discordarem entre si).
    const behind=diff>0.5;
    // Diagnóstico automático (substituiu os campos abertos de Constraints/Risks/Validations).
    const dgRow=(lbl,items)=>'<tr><th>'+lbl+'</th><td>'+
      ((items&&items.length)
        ? items.map(i=>'<div class="dg dg-'+i.sev+'"><i></i><span>'+i.text+'</span></div>').join('')
        : '<span class="t-dim">Sem apontamentos.</span>')+'</td></tr>';
    const delivHtml=(a.deliveries||[]).slice(0,7).map(([nm,g])=>{
      const p=pct(g.dsp,g.sp), pi=pct(g.insp,g.sp);
      const tN=g.n-g.dn-g.inN, tSP=g.sp-g.dsp-g.insp;
      return '<div class="deliv">• <strong>'+esc(nm)+'</strong> — '+fmtSP(g.sp)+' SP · '+g.n+' issues <span class="pill '+(p>=70?'green':(p>=30?'yellow':'blue'))+'">'+p+'% done</span>'+
        '<div class="sbar"><div style="background:var(--verde);width:'+p+'%"></div><div style="background:var(--turquesa);width:'+pi+'%"></div></div>'+
        '<small class="brk">'+g.dn+' concluída(s) ('+fmtSP(g.dsp)+' SP) · '+g.inN+' em andamento ('+fmtSP(g.insp)+' SP) · '+tN+' não iniciada(s) ('+fmtSP(tSP)+' SP)</small>'+
        (g.ex.length?'<br><small class="brk" style="color:var(--text-disabled)">↳ '+esc(g.ex.map(s=>s.slice(0,80)).join(' · '))+'</small>':'')+'</div>';
    }).join('')||'—';
    const doneListHtml=(a.doneList&&a.doneList.length)
      ? a.doneList.slice(0,10).map(t=>'<div class="deliv">'+ico('check',14)+' <strong>'+esc(t.key)+'</strong> — '+esc(t.summary.slice(0,90))+' <small style="color:var(--text-secondary)">('+fmtSP(t.sp)+' SP)</small></div>').join('')
        +(a.doneList.length>10?'<small class="brk">… +'+(a.doneList.length-10)+' tarefas</small>':'')
      : '<span style="color:var(--text-secondary)">Nenhuma tarefa concluída ainda nesta sprint.</span>';
    html+='<div class="squad-block"><h3>'+sq.name+' — '+esc(sprintLabel(a))+' <span class="pill blue">Day '+a.day+'/'+LEN+'</span></h3>'+
      '<h4 style="margin:var(--sp-15) 0 var(--sp-1);font-size:var(--fs-sm)">Sprint Agreements</h4>'+
      '<table class="agr"><tbody>'+
      '<tr><th>Sprint Goal</th><td>'+esc(a.goal||'Sem goal registrado no Jira — defina o goal na sprint do board')+'</td></tr>'+
      '<tr><th>Main deliveries <small style="color:var(--text-secondary)">(auto, por épico/tag)</small></th><td>'+delivHtml+'</td></tr>'+
      '<tr><th>'+ico('check',14)+' Tarefas concluídas ('+(a.doneList?a.doneList.length:0)+')</th><td>'+doneListHtml+'</td></tr>'+
      dgRow('🧭 Restrições &amp; capacidade',(a.diag||{}).constraints)+
      dgRow('⚠️ Riscos',(a.diag||{}).risks)+
      dgRow('✅ Validações pendentes',(a.diag||{}).validations)+
      '</tbody></table>'+
      '<p style="font-size:var(--fs-label);color:var(--text-disabled);margin:6px 0 14px">'+
        'Diagnóstico gerado a cada carga a partir dos dados do Jira — escopo, ritmo, filas, retrabalho e carga de QA. '+
        '<span class="dg-key"><i class="dg-crit"></i>crítico</span> <span class="dg-key"><i class="dg-warn"></i>atenção</span> <span class="dg-key"><i class="dg-ok"></i>saudável</span></p>'+
      (()=>{const pd=pct(a.doneSP,a.badgeScope), pi=pct(a.inprogSP,a.badgeScope), pn=Math.max(0,100-pd-pi);
        return '<h4 style="margin:var(--sp-2) 0 var(--sp-05);font-size:var(--fs-sm)">Progresso do sprint <small style="color:var(--text-secondary);font-weight:400">(por SP — espelha o gadget do Jira)</small></h4>'+
        '<div class="sbar lg"><div style="background:var(--verde);width:'+pd+'%"></div><div style="background:var(--turquesa);width:'+pi+'%"></div></div>'+
        '<div class="sbar-legend">'+
        '<span><b style="color:var(--verde)">'+pd+'%</b>Concluído · '+fmtSP(a.doneSP)+' SP · '+a.doneN+' issues</span>'+
        '<span><b style="color:var(--turquesa)">'+pi+'%</b>Em andamento · '+fmtSP(a.inprogSP)+' SP · '+a.inprogN+' issues</span>'+
        '<span><b>'+pn+'%</b>Não iniciado · '+fmtSP(a.todoSP)+' SP · '+a.todoN+' issues</span></div>'+
        // Decomposição do "Em andamento" por status da UNIDADE DE TRABALHO (subtarefa quando a
        // história foi quebrada, senão o próprio card): mini-barra empilhada + legenda por status.
        (()=>{const ipl=a.inprogByStatus||[]; const tot=ipl.reduce((x,kv)=>x+kv[1],0);
          if(!tot) return '';
          const u=a.inprogUnits||{sub:0,card:0};
          const PAL=DS_SERIES_VAR;   // só cores da marca (DS), via var() para o tema seguir :root
          const seg=ipl.map((kv,i)=>'<div style="flex:'+kv[1]+';background:'+PAL[i%PAL.length]+'" title="'+esc(stLabel(kv[0]))+' · '+kv[1]+' unidade(s) de trabalho"></div>').join('');
          const leg=ipl.map((kv,i)=>'<span class="ipp-item"><i style="background:'+PAL[i%PAL.length]+'"></i>'+esc(stLabel(kv[0]))+'<b>'+kv[1]+'</b></span>').join('');
          return '<div class="ipp">'+
            '<div class="ipp-head">No que o time está trabalhando agora <small>· '+tot+' unidades de trabalho ('+u.sub+' subtarefa'+(u.sub===1?'':'s')+' + '+u.card+' card'+(u.card===1?'':'s')+' sem quebra) — conta a subtarefa quando a história foi quebrada, senão o próprio card, sem contar os dois</small></div>'+
            '<div class="ipp-bar">'+seg+'</div>'+
            '<div class="ipp-legend">'+leg+'</div>'+
          '</div>';})();})()+
      '<div class="kpi-grid">'+
      kpi('Scope SP',fmtSP(a.badgeScope),a.todoN+a.inprogN+a.doneN+' issues')+
      kpi('Completed SP',fmtSP(a.doneSP),a.doneN+' issues done')+
      kpi('Remaining SP',fmtSP(a.remaining),a.todoN+' to do · '+a.inprogN+' in progress')+
      kpi('% Done (SP)',pSP+'%','ideal dia '+a.day+': '+Math.round(a.day/LEN*100)+'%',behind?'crit':'')+
      kpi('% Done (issues)',pIss+'%','métrica do gadget Jira')+
      kpi('vs. ideal',(diff>0.5?'+':'')+fmtSP(diff)+' SP',diff>0.5?'atrás do ideal':(diff<-0.5?'à frente do ideal':'on track'),behind?'crit':'')+
      (a.cancSP>0?kpi('Cancelled SP',fmtSP(a.cancSP),a.cancN+' issues canceladas — fora do scope'):'')+
      '</div>'+
      '<div class="chart-holder"><canvas id="bd_'+sq.code+'"></canvas></div>'+
      '<p style="margin:10px 0 0"><a class="jira-link" href="'+boardUrl(sq)+'" target="_blank">'+ico('external',13)+' Open Sprint Insights in Jira ('+sq.code+') — Progresso + Burndown</a></p></div>';
  return html;
}
// Burndown de uma squad (chamado depois do HTML entrar no DOM)
function drawBurndown(sq){
  const a=DATA[sq.code]&&DATA[sq.code].active; if(!a) return;
  const labels=['Start']; const ideal=[a.badgeScope]; const actual=[a.badgeScope];
  const LEN=a.len||WORKDAYS;
  for(let i=1;i<=LEN;i++){labels.push('D'+i);ideal.push(Math.max(0,+(a.badgeScope*(1-i/LEN)).toFixed(1)));actual.push(i===a.day?a.remaining:null);}
  const ctx=document.getElementById('bd_'+sq.code); if(!ctx) return;
  charts.push(new Chart(ctx,{type:'line',data:{labels,datasets:[
    {label:'Ideal (SP remaining)',data:ideal,borderColor:DS.textDim,borderDash:[5,4],pointRadius:0,tension:0},
    {label:'Actual (SP remaining)',data:actual,borderColor:DS.verde,backgroundColor:DS.verde,pointRadius:5,spanGaps:true,tension:0}
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:DS.textSec,font:{size:11}}}},
    scales:{x:{ticks:{color:DS.textDim},grid:{color:DS.gridLine}},y:{beginAtZero:true,ticks:{color:DS.textDim},grid:{color:DS.gridLine}}}}}));
}

/* ---------- PÁGINA ÚNICA (28/07/2026) ----------
   Antes eram duas abas (Sprint Plan / Detalhamento por Squad) com uma squad por vez. Agora tudo
   vive numa página só: resumos no topo (Overview + Índice de retorno) e, abaixo, uma seção completa
   por squad (Sprint Plan + Detalhamento). Os botões do header fixo rolam até a seção da squad. */
function renderAll(){
  charts.forEach(c=>{try{c.destroy()}catch(e){}}); charts=[];
  const el=document.getElementById('app');
  let html=summariesHtml();
  for(const sq of SQUADS){
    html+='<section class="squad-section" id="sq-'+sq.code+'">'+
      '<h2 class="squad-title"><span class="pill gray">'+sq.code+'</span> '+esc(sq.name)+'</h2>'+
      squadPlanHtml(sq)+squadDetailHtml(sq.code)+
    '</section>';
  }
  html+=depsSectionHtml();   // última aba: dependências entre squads
  el.innerHTML=html;
  for(const sq of SQUADS){ drawBurndown(sq); drawVelocity(sq.code); }
  // Tabelas com sprints em coluna abrem já roladas até o fim (sprint atual à vista)
  el.querySelectorAll('.table-scroll[data-scroll-end]').forEach(w=>{ w.scrollLeft=w.scrollWidth; });
  renderSquadNav();
  wireDeps();
}
// Botões de squad no header fixo: rolam até a seção (não trocam de view)
function renderSquadNav(){
  const t=document.getElementById('squadNav'); if(!t) return;
  // 1b: sigla em negrito + nome completo em peso normal (o "·" saiu — a diferença de peso já
  // separa os dois, e o ponto virava ruído repetido 4 vezes no trilho).
  t.innerHTML=SQUADS.map(s=>'<button data-sq="'+s.code+'">'+s.code+' <span class="sq-name">'+esc(s.name)+'</span></button>').join('')+
    '<button data-sq="DEP">DEP <span class="sq-name">Dependências</span></button>';
  t.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const sec=document.getElementById('sq-'+b.dataset.sq);
    if(sec) sec.scrollIntoView({behavior:'smooth',block:'start'});
    t.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));
  });
  // marca o botão da squad visível conforme a página rola
  if(window.IntersectionObserver && !window.__navObs__){
    window.__navObs__=new IntersectionObserver(es=>{
      const vis=es.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top)[0];
      if(!vis) return;
      const code=vis.target.id.replace('sq-','');
      t.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x.dataset.sq===code));
    },{rootMargin:'-45% 0px -50% 0px'});
  }
  if(window.__navObs__){
    window.__navObs__.disconnect();
    SQUADS.map(s=>s.code).concat(['DEP']).forEach(c=>{const el2=document.getElementById('sq-'+c); if(el2) window.__navObs__.observe(el2);});
  }
}
function kpi(l,v,d,variant){
  // variant 'crit' = filete de 3px em Pulso + número na cor de crítico (o único uso de Pulso
  // na régua de KPIs, conforme 1b: "Pulso só para crítico").
  const cls='kpi-card'+(variant?' '+variant:'');
  const vc=variant==='crit'?' class="value t-crit"':' class="value"';
  return '<div class="'+cls+'"><div class="label">'+l+'</div><div'+vc+'>'+v+'</div><div class="delta">'+(d||'')+'</div></div>';}
